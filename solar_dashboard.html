<script>
"use strict";

/* =====================================================================
 *  TY Solar Multi-Station Monitor V3
 *  - 多设备同屏显示
 *  - localStorage 持久化所有配置
 *  - 电池电压百分比 (可配置 V_min / V_max / 告警阈值)
 *  - 与 v2 共用 bridge.py (POST /api/modbus 转发到任意 host:port)
 * ===================================================================== */

// ---------- Constants ----------
const STORAGE_KEY = 'ty_dashboard_v3';
const BRIDGE_API = '';         // same-origin
const READ_BLOCK = { addr: 0x3030, count: 40, fc: 4 };  // 主实时块,文档示例 1
const FAILS_TO_OFFLINE = 3;    // 连续失败 N 次标记离线

// ---------- Status bit decoders (TY V3.9) ----------
const BAT_STATUS_BITS = {
  temp: { mask: 0x00F0, shift: 4, map: { 0: '正常', 1: '高溫保護' } },
  volt: { mask: 0x000F, shift: 0, map: { 0: '正常', 1: '過壓保護', 2: '欠壓', 3: '過放保護' } },
};
const CHG_STATUS_BITS = {
  daynight:   { mask: 0x0020, shift: 5, map: { 0: '白天', 1: '夜晚' } },
  overTemp:   { mask: 0x0010, shift: 4, map: { 0: '正常', 1: '充電過溫' } },
  chargeMode: { mask: 0x000C, shift: 2, map: { 0: '未充電', 1: '浮充', 2: '強充', 3: '均衡充' } },
  fault:      { mask: 0x0002, shift: 1, map: { 0: '正常', 1: '故障' } },
  charging:   { mask: 0x0001, shift: 0, map: { 0: '未充電', 1: '正在充電' } },
};
const DISCHG_STATUS_BITS = {
  loadLevel:  { mask: 0x3000, shift: 12, map: { 0: '輕載', 1: '中度', 2: '額定', 3: '過載' } },
  shortProt:  { mask: 0x0800, shift: 11, map: { 0: '正常', 1: '短路保護' } },
  hwProt:     { mask: 0x0010, shift: 4,  map: { 0: '正常', 1: '硬件保護' } },
  openProt:   { mask: 0x0008, shift: 3,  map: { 0: '正常', 1: '開路保護' } },
  overTemp:   { mask: 0x0004, shift: 2,  map: { 0: '正常', 1: '放電過溫' } },
  fault:      { mask: 0x0002, shift: 1,  map: { 0: '正常', 1: '故障' } },
  discharging:{ mask: 0x0001, shift: 0,  map: { 0: '未放電', 1: '正在放電' } },
};

// 0x3030+40 字段位置（offset = addr - 0x3030）
const FIELD_OFFSETS = {
  slaveId: 0, runDays: 1, batLevel: 2, batStatus: 3, chgStatus: 4, dischgStatus: 5,
  envTemp: 6, devTemp: 7,
  overDischgCnt: 8, fullCnt: 9, overVoltCnt: 10, overCurrCnt: 11,
  shortCnt: 12, openCnt: 13, hwProtCnt: 14, chgOverTempCnt: 15, dischgOverTempCnt: 16,
  // 17..20 protocol gap (0x3041..0x3044)
  batSoc: 21,
  batVoltage: 22, batCurrent: 23,           // batCurrent: signed
  batPowerL: 24, batPowerH: 25,             // signed 32-bit (LH)
  loadVoltage: 26, loadCurrent: 27,
  loadPowerL: 28, loadPowerH: 29,
  pvVoltage: 30, pvCurrent: 31,
  pvPowerL: 32, pvPowerH: 33,
  todayChgKwh: 34,
  totalChgKwhL: 35, totalChgKwhH: 36,
  todayLoadKwh: 37,
  totalLoadKwhL: 38, totalLoadKwhH: 39,
};

// ---------- App state ----------
const HISTORY_WINDOW_MS = 24 * 60 * 60 * 1000;
const HISTORY_MAX = 86401;       // 以時間保留 24 小時，亦支援最快每秒一次輪詢
const PREDICTION_HISTORY_REFRESH_MS = 5 * 60 * 1000;
const PREDICTION_MAX_GAP_MS = 90 * 60 * 1000; // 不跨越長時間斷線推算功率
const _predictionHistoryCache = {};

const State = {
  devices: [],          // [{id, name, host, port, slaveId, batVMin, batVMax, batVAlarmLow, enabled}]
  data: {},             // { deviceId: { lastReading, lastUpdate, failCount, lastError, online, alarm } }
  history: {},          // { deviceId: [ { t, pvP, loadP, batV, batSoc, envT } ] }
  pollers: {},          // { deviceId: timer }
  globalSettings: {
    pollInterval: 3000, // ms
    timeout: 2500,      // ms
    historyRange: '1h', // '15m' | '1h' | '6h' | 'all'
    logIntervalMin: 30, // 长期 CSV 采样间隔(分钟)
    brandName: 'SOLAR · MULTI',
    brandSub:  'multi-station monitor',
    brandLogo: null,    // dataURL of uploaded logo, or null
    brandMark: 'TY',    // 文字 logo (当无图片时显示)
  },
  bridgeOk: false,
  openDrawerDevice: null,  // 当前打开侧滑的设备 id
  drawerChart: null,       // 当前 Chart.js 实例
  lastLogSave: {},         // deviceId → timestamp(ms) of last successful log_save
  weather: {},             // { deviceId: { fetchedAt, forecast: [...] } }
};

// ---------- DOM helpers ----------
const $ = (id) => document.getElementById(id);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function toast(msg, kind = 'info') {
  const el = document.createElement('div');
  el.className = 'toast' + (kind !== 'info' ? ' ' + kind : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }, 2400);
}

function uid() { return 'd_' + Math.random().toString(36).slice(2, 9); }

function fmt(v, digits = 2) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return Number(v).toFixed(digits);
}

// kWh → Wh (數值換算成瓦時)
function kwhToWh(kwh) {
  if (kwh === null || kwh === undefined || isNaN(kwh)) return null;
  return Math.round(Number(kwh) * 1000);
}
// 顯示能量值, 統一用 Wh, 自動加千分位逗號
function fmtWh(kwh) {
  const wh = kwhToWh(kwh);
  if (wh === null) return '—';
  return wh.toLocaleString('en');
}
// 直接顯示 Wh 數值(輸入已是 Wh, 不再 ×1000)
function fmtWhNum(wh) {
  if (wh === null || wh === undefined || isNaN(wh)) return '—';
  return Math.round(Number(wh)).toLocaleString('en');
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ---------- Storage: server-side primary + localStorage fallback ----------
//
// Strategy:
//   - Server (/api/config_get|set) is the source of truth — shared across all clients
//   - localStorage is a local cache for offline/no-bridge scenarios
//   - On page load: try server first, fall back to localStorage if server unreachable
//   - On every save: write to BOTH server and localStorage
//
let _saveDebounceTimer = null;

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (parsed.devices) State.devices = parsed.devices;
    if (parsed.globalSettings) Object.assign(State.globalSettings, parsed.globalSettings);
    return true;
  } catch (e) {
    console.error('loadFromLocalStorage failed', e);
    return false;
  }
}

function writeLocalStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: 3,
      devices: State.devices,
      globalSettings: State.globalSettings,
    }));
  } catch (e) {
    console.warn('localStorage write failed:', e);
  }
}

async function loadFromServer() {
  try {
    const r = await fetch('/api/config_get');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'fetch failed');
    if (!d.exists || !d.config) return false;
    if (d.config.devices) State.devices = d.config.devices;
    if (d.config.globalSettings) Object.assign(State.globalSettings, d.config.globalSettings);
    // Refresh an untouched settings form after the first authoritative server load.
    if (parseHashRoute().view === 'settings' && !SettingsUI.formDirty) SettingsUI.mounted = false;
    // 同时写一份到 localStorage 当离线缓存
    writeLocalStorage();
    return true;
  } catch (e) {
    console.warn('Server config fetch failed, fallback to localStorage:', e.message);
    return false;
  }
}

async function saveToServer() {
  try {
    const r = await fetch('/api/config_set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        config: {
          version: 3,
          devices: State.devices,
          globalSettings: State.globalSettings,
        }
      })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'save failed');
    return true;
  } catch (e) {
    console.warn('Server config save failed:', e.message);
    return false;
  }
}

// 公开 API: 兼容旧代码,内部走服务端 + 本地双写
function saveToStorage() {
  // 立即写本地(快, 同步)
  writeLocalStorage();
  // 服务端写做防抖 (300ms 内多次调用合并成一次, 避免快速输入时连续 POST)
  if (_saveDebounceTimer) clearTimeout(_saveDebounceTimer);
  _saveDebounceTimer = setTimeout(async () => {
    _saveDebounceTimer = null;
    const ok = await saveToServer();
    if (!ok) {
      // 不打扰用户,但状态条可以显示一个小提示
      console.warn('云端配置同步失败,本地已保存');
    }
  }, 300);
}

// 兼容旧名字
function loadFromStorage() {
  // 这是同步版本,只读 localStorage(用于不能等异步的场景)
  return loadFromLocalStorage();
}

// ---------- Modbus core ----------
function crc16(buf) {
  let crc = 0xFFFF;
  for (let i = 0; i < buf.length; i++) {
    crc ^= buf[i];
    for (let j = 0; j < 8; j++) {
      if (crc & 1) crc = (crc >> 1) ^ 0xA001;
      else crc >>= 1;
    }
  }
  return crc & 0xFFFF;
}
function buildReadFrame(slave, fc, addr, count) {
  const buf = new Uint8Array(8);
  buf[0] = slave; buf[1] = fc;
  buf[2] = (addr >> 8) & 0xFF; buf[3] = addr & 0xFF;
  buf[4] = (count >> 8) & 0xFF; buf[5] = count & 0xFF;
  const crc = crc16(buf.subarray(0, 6));
  buf[6] = crc & 0xFF; buf[7] = (crc >> 8) & 0xFF;
  return buf;
}
function parseResponse(rx, expSlave, expFc) {
  if (rx.length < 5) throw new Error(`應答太短 ${rx.length}B`);
  if (rx[0] !== expSlave) throw new Error(`從站 ID 不符 ${rx[0]} ≠ ${expSlave}`);
  if (rx[1] === (expFc | 0x80)) {
    const codes = { 1: '功能碼不支援', 2: '寄存器越界', 3: '數據非法', 4: '從機故障' };
    throw new Error('Modbus 異常 ' + (codes[rx[2]] || rx[2]));
  }
  if (rx[1] !== expFc) throw new Error(`功能碼不符 ${rx[1]} ≠ ${expFc}`);
  const dl = rx.length - 2;
  const recvCrc = (rx[dl + 1] << 8) | rx[dl];
  const calcCrc = crc16(rx.subarray(0, dl));
  if (recvCrc !== calcCrc) throw new Error('CRC 錯誤');
  if (expFc === 3 || expFc === 4) {
    const bc = rx[2];
    const regs = [];
    for (let i = 0; i < bc; i += 2) regs.push((rx[3 + i] << 8) | rx[4 + i]);
    return regs;
  }
  return Array.from(rx.subarray(2, dl));
}

// ---------- Bridge IO ----------
async function bridgePing() {
  try {
    const r = await fetch('/api/ping');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    await r.json();
    State.bridgeOk = true;
    const el = $('bridgeStatus');
    el.classList.add('ok'); el.classList.remove('err');
    el.querySelector('span:last-child').textContent = 'bridge ✓';
    return true;
  } catch (e) {
    State.bridgeOk = false;
    const el = $('bridgeStatus');
    el.classList.remove('ok'); el.classList.add('err');
    el.querySelector('span:last-child').textContent = 'bridge ✗';
    return false;
  }
}

async function modbusRead(host, port, slave, fc, addr, count, timeoutMs) {
  const frame = buildReadFrame(slave, fc, addr, count);
  const expectedLen = 5 + count * 2;
  const r = await fetch('/api/modbus', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      host, port, tx: Array.from(frame),
      expectedLen, timeout: timeoutMs / 1000,
    }),
  });
  if (!r.ok) throw new Error('bridge HTTP ' + r.status);
  const d = await r.json();
  if (!d.success) throw new Error(d.error || 'bridge fail');
  const rx = new Uint8Array(d.rx);
  return parseResponse(rx, slave, fc);
}

// ---------- Field extraction ----------
function decodeBits(value, defs) {
  if (value === null || value === undefined) return {};
  const out = {};
  for (const [k, def] of Object.entries(defs)) {
    const v = (value & def.mask) >> def.shift;
    out[k] = { value: v, label: def.map[v] !== undefined ? def.map[v] : `0x${v.toString(16)}` };
  }
  return out;
}
function extractI16(regs, off) {
  const v = regs[off]; if (v === undefined) return null;
  return v >= 0x8000 ? v - 0x10000 : v;
}
function extractU32(regs, offLo, offHi) {
  const lo = regs[offLo], hi = regs[offHi];
  if (lo === undefined || hi === undefined) return null;
  return (hi << 16) | lo;
}
function extractI32(regs, offLo, offHi) {
  const u = extractU32(regs, offLo, offHi);
  if (u === null) return null;
  return u >= 0x80000000 ? u - 0x100000000 : u;
}

function decodeReading(regs) {
  const F = FIELD_OFFSETS;
  const out = {
    slaveId:      regs[F.slaveId],
    runDays:      regs[F.runDays],
    batLevel:     regs[F.batLevel] / 100,
    batStatus:    regs[F.batStatus],
    chgStatus:    regs[F.chgStatus],
    dischgStatus: regs[F.dischgStatus],
    envTemp:      extractI16(regs, F.envTemp) / 100,
    devTemp:      extractI16(regs, F.devTemp) / 100,
    overDischgCnt: regs[F.overDischgCnt], fullCnt: regs[F.fullCnt],
    overVoltCnt: regs[F.overVoltCnt], overCurrCnt: regs[F.overCurrCnt],
    shortCnt: regs[F.shortCnt], openCnt: regs[F.openCnt],
    hwProtCnt: regs[F.hwProtCnt],
    chgOverTempCnt: regs[F.chgOverTempCnt], dischgOverTempCnt: regs[F.dischgOverTempCnt],
    batSoc:       regs[F.batSoc],
    batVoltage:   regs[F.batVoltage] / 100,
    batCurrent:   extractI16(regs, F.batCurrent) / 100,
    batPower:     extractI32(regs, F.batPowerL, F.batPowerH) / 100,
    loadVoltage:  regs[F.loadVoltage] / 100,
    loadCurrent:  regs[F.loadCurrent] / 100,
    loadPower:    extractU32(regs, F.loadPowerL, F.loadPowerH) / 100,
    pvVoltage:    regs[F.pvVoltage] / 100,
    pvCurrent:    regs[F.pvCurrent] / 100,
    pvPower:      extractU32(regs, F.pvPowerL, F.pvPowerH) / 100,
    todayChgKwh:  regs[F.todayChgKwh] / 100,
    totalChgKwh:  extractU32(regs, F.totalChgKwhL, F.totalChgKwhH) / 100,
    todayLoadKwh: regs[F.todayLoadKwh] / 100,
    totalLoadKwh: extractU32(regs, F.totalLoadKwhL, F.totalLoadKwhH) / 100,
  };
  // 解析常用位字段
  out.bat   = decodeBits(out.batStatus, BAT_STATUS_BITS);
  out.chg   = decodeBits(out.chgStatus, CHG_STATUS_BITS);
  out.dis   = decodeBits(out.dischgStatus, DISCHG_STATUS_BITS);

  // 故障汇总 — 分两类:
  //   faultsCritical: 与电压无关的物理故障(硬件/温度/过载) — 永远触发 alarm
  //   faultsVoltage:  控制器自报的电压相关状态 — 用户阈值未触发时只作为 warn 提示
  out.faultsCritical = [];
  out.faultsVoltage = [];
  if (out.bat.temp && out.bat.temp.value !== 0) out.faultsCritical.push(out.bat.temp.label);
  if (out.bat.volt && out.bat.volt.value !== 0) out.faultsVoltage.push('電池' + out.bat.volt.label);
  if (out.chg.overTemp && out.chg.overTemp.value === 1) out.faultsCritical.push('充電過溫');
  if (out.chg.fault    && out.chg.fault.value === 1)    out.faultsCritical.push('充電故障');
  if (out.dis.shortProt && out.dis.shortProt.value === 1) out.faultsCritical.push('短路保護');
  if (out.dis.hwProt   && out.dis.hwProt.value === 1)   out.faultsCritical.push('硬件保護');
  if (out.dis.openProt && out.dis.openProt.value === 1) out.faultsCritical.push('開路保護');
  if (out.dis.overTemp && out.dis.overTemp.value === 1) out.faultsCritical.push('放電過溫');
  if (out.dis.fault    && out.dis.fault.value === 1)    out.faultsCritical.push('放電故障');
  if (out.dis.loadLevel && out.dis.loadLevel.value === 3) out.faultsCritical.push('過載');
  // 合并版本(给详情面板用)
  out.faults = [...out.faultsCritical, ...out.faultsVoltage];

  // 充电阶段汇总
  if (out.chg.daynight && out.chg.daynight.value === 1) out.stage = '夜晚';
  else if (out.chg.chargeMode) {
    out.stage = out.chg.chargeMode.label;
  }
  return out;
}

// ---------- Polling ----------
function startPollingDevice(dev) {
  stopPollingDevice(dev.id);
  if (!dev.enabled) return;
  const tick = () => pollOnce(dev);
  tick();
  State.pollers[dev.id] = setInterval(tick, State.globalSettings.pollInterval);
}
function stopPollingDevice(id) {
  if (State.pollers[id]) {
    clearInterval(State.pollers[id]);
    delete State.pollers[id];
  }
}
function stopAllPolling() {
  for (const id of Object.keys(State.pollers)) stopPollingDevice(id);
}
function startAllPolling() {
  for (const dev of State.devices) startPollingDevice(dev);
}

// ============================================================
//  PV 總發電量 (Wh) - 由 bridge.py 後台 24h 累積, 前端讀取
//  fallback: 若 bridge 唔可達, 用 localStorage 本地累積 (舊邏輯)
// ============================================================
const _pvAccumCache = {};   // deviceId → wh
let _pvAccumLastFetch = 0;
const PV_ACCUM_FETCH_INTERVAL = 30000;  // 30 秒拉一次

async function fetchPvAccumFromServer() {
  try {
    const r = await fetch('/api/pv_accum');
    if (!r.ok) return null;
    const d = await r.json();
    if (!d.success) return null;
    // 更新緩存
    const devices = d.devices || {};
    for (const [devId, info] of Object.entries(devices)) {
      _pvAccumCache[devId] = info.today_wh || 0;
    }
    _pvAccumLastFetch = Date.now();
    return d;
  } catch (e) {
    return null;
  }
}

// 啟動定時拉取 (只啟動一次)
let _pvAccumTimer = null;
function startPvAccumPolling() {
  if (_pvAccumTimer) return;
  fetchPvAccumFromServer();   // 首次立刻拉
  _pvAccumTimer = setInterval(() => {
    fetchPvAccumFromServer().then(() => {
      // 拉完更新看板 (主看板顯示嗰陣)
      if (document.body.getAttribute('data-view') === 'dashboard') {
        refreshDashboardKPI();
      }
    });
  }, PV_ACCUM_FETCH_INTERVAL);
}

function _todayKey(ts) {
  const d = new Date(ts || Date.now());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function _pvAccumKey(deviceId, dateKey) {
  return `pvAccum:${deviceId}:${dateKey}`;
}
function getPvAccumWh(deviceId, dateKey = null) {
  // 優先用服務端值 (今日 only)
  if (!dateKey || dateKey === _todayKey()) {
    if (_pvAccumCache[deviceId] !== undefined) {
      return _pvAccumCache[deviceId];
    }
  }
  // Fallback: localStorage (server 未通時候用)
  const k = _pvAccumKey(deviceId, dateKey || _todayKey());
  const v = localStorage.getItem(k);
  return v ? parseFloat(v) : 0;
}
function setPvAccumWh(deviceId, wh, dateKey = null) {
  const k = _pvAccumKey(deviceId, dateKey || _todayKey());
  localStorage.setItem(k, String(wh));
}
function accumulatePvEnergy(dev, prevReading, prevUpdate, reading, nowMs) {
  // 服務端通時, 前端唔需要自己累積 (避免雙重累積)
  // 但係仍然保留 localStorage fallback 邏輯, 等 bridge 故障時都有粗略數據
  if (!prevReading || !prevUpdate) return;
  const dtSec = (nowMs - prevUpdate) / 1000;
  if (dtSec <= 0 || dtSec > 600) return;
  const pvNow = Number(reading.pvPower) || 0;
  const pvPrev = Number(prevReading.pvPower) || 0;
  const avgW = (pvPrev + pvNow) / 2;
  const incrementWh = avgW * dtSec / 3600;
  if (incrementWh <= 0) return;
  const nowDay = _todayKey(nowMs);
  const today = parseFloat(localStorage.getItem(_pvAccumKey(dev.id, nowDay)) || '0');
  setPvAccumWh(dev.id, today + incrementWh, nowDay);
}
// 清理舊累積 (保留近 7 天, 每次 boot 呼叫一次)
function cleanupOldPvAccum() {
  const now = Date.now();
  const cutoff = now - 7 * 86400000;
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith('pvAccum:')) continue;
    const parts = key.split(':');
    if (parts.length < 3) continue;
    const dateStr = parts[2];
    const ts = new Date(dateStr + 'T00:00:00').getTime();
    if (isNaN(ts) || ts < cutoff) localStorage.removeItem(key);
  }
}

async function pollOnce(dev) {
  if (!State.data[dev.id]) State.data[dev.id] = { failCount: 0, online: false };
  const d = State.data[dev.id];
  try {
    const regs = await modbusRead(
      dev.host, dev.port, dev.slaveId, READ_BLOCK.fc,
      READ_BLOCK.addr, READ_BLOCK.count, State.globalSettings.timeout
    );
    const reading = decodeReading(regs);
    const prevReading = d.lastReading;
    const prevUpdate = d.lastUpdate;
    d.lastReading = reading;
    d.lastUpdate  = Date.now();
    d.failCount   = 0;
    d.online      = true;
    d.lastError   = null;

    // PV 總發電量累積估算 (梯形積分: 平均功率 × 時間)
    accumulatePvEnergy(dev, prevReading, prevUpdate, reading, d.lastUpdate);

    // 追加历史数据点
    appendHistoryPoint(dev.id, {
      t: d.lastUpdate,
      pvP: reading.pvPower,
      loadP: reading.loadPower,
      batV: reading.batVoltage,
      batSoc: reading.batSoc,
      envT: reading.envTemp,
    });
    refreshVisiblePrediction(dev, reading);

    // 长期 CSV 日志:每 N 分钟保存一条
    const logIntervalMs = (State.globalSettings.logIntervalMin || 30) * 60 * 1000;
    const lastLog = State.lastLogSave[dev.id] || 0;
    if (Date.now() - lastLog >= logIntervalMs) {
      saveLogPoint(dev, reading).catch(e => console.warn('log save failed', e));
    }

    // 如果当前侧滑面板正在显示这个设备,实时更新 chart
    if (State.openDrawerDevice === dev.id && State.drawerChart) {
      updateDrawerChart();
    }
  } catch (err) {
    d.failCount++;
    d.lastError = err.message;
    if (d.failCount >= FAILS_TO_OFFLINE) {
      d.online = false;
    }
  }
  // 看板模式: 只更新该设备在站点列表中的一行(避免整页重渲染影响图表动画)
  refreshDashSiteRow(dev);
  renderTopStats();
}

// 轻量刷新看板上某行(也刷新 KPI/事件流, 但不重画图表)
function refreshDashSiteRow(dev) {
  const route = parseHashRoute();
  if (route.view === 'device' && route.deviceId === dev.id) {
    // 当前正在看这个设备的详情页 — 不做事(详情页有自己的轮询)
    return;
  }
  // 在看板上: 重新计算 KPI 并替换该行 (左欄站點列表)
  const oldRow = document.querySelector(`.dash-site[data-id="${dev.id}"]`);
  if (oldRow) {
    const newHtml = renderDashSiteRow(dev);
    const wrapper = document.createElement('div');
    wrapper.innerHTML = newHtml;
    const newRow = wrapper.firstElementChild;
    newRow.addEventListener('click', () => navigateToDevice(dev.id));
    oldRow.replaceWith(newRow);
  }
  // KPI 数字 + 事件流也要更新
  refreshDashboardKPI();
}

function refreshDashboardKPI() {
  let totalPV = 0, totalLoad = 0, totalGen = 0, totalConsume = 0;
  let totalPvAccumWh = 0;
  let online = 0, alarmCount = 0, warnCount = 0;
  let totalAllTime = 0;
  for (const dev of State.devices) {
    const data = State.data[dev.id];
    if (!data || !data.online || !data.lastReading) continue;
    const r = data.lastReading;
    online++;
    totalPV     += r.pvPower   || 0;
    totalLoad   += r.loadPower || 0;
    totalGen    += r.todayChgKwh || 0;
    totalConsume+= r.todayLoadKwh || 0;
    totalAllTime += r.totalChgKwh || 0;
    totalPvAccumWh += getPvAccumWh(dev.id);
    const lvl = alarmLevel(dev, r);
    if (lvl === 2) alarmCount++;
    else if (lvl === 1) warnCount++;
  }
  const fmtNum = (v, d=1) => v.toLocaleString('en', { maximumFractionDigits: d });

  // 新版指挥中心 8 个 stat: 当前发电 / 当前负载 / PV總發電 / 入電池 / 用電 / 累計入電池 / 在线 / 告警
  const stats = document.querySelectorAll('.cc-stat-num');
  if (stats.length >= 8) {
    stats[0].textContent = fmtNum(totalPV, 0);
    stats[1].textContent = fmtNum(totalLoad, 0);
    stats[2].textContent = fmtWhNum(totalPvAccumWh);
    stats[3].textContent = fmtWh(totalGen);
    stats[4].textContent = fmtWh(totalConsume);
    stats[5].textContent = fmtWh(totalAllTime);
    stats[6].textContent = online;
    stats[7].textContent = alarmCount;
  }
  // 能量流向 SVG (右栏)
  const flow = document.querySelector('.cc-flow');
  if (flow) flow.innerHTML = renderPowerFlowSVG(totalPV, totalLoad);
  // 事件流
  const stream = document.querySelector('.cc-event-stream');
  if (stream) stream.innerHTML = renderEventStream();
  // 地图标记颜色更新(不重建地图,只更新标记的 DOM)
  updateMapMarkers();
}

function updateMapMarkers() {
  for (let i = 0; i < _siteMarkers.length; i++) {
    const m = _siteMarkers[i];
    const devId = m._tySolarDevId;
    if (!devId) continue;
    const dev = State.devices.find(d => d.id === devId);
    if (!dev) continue;
    const d = State.data[devId] || {};
    const r = d.lastReading;
    const offline = !dev.enabled || (d.failCount >= FAILS_TO_OFFLINE) || !r;
    const level = !offline ? alarmLevel(dev, r) : -1;
    const color = offline ? '#6c7689' :
                  level === 2 ? '#ef4444' :
                  level === 1 ? '#fbbf24' :
                  '#22c55e';
    const isAlarm = !offline && level === 2;
    const el = m.getElement();
    if (el) {
      const wrap = el.querySelector('.cc-marker-wrap');
      if (wrap) wrap.classList.toggle('alarm', isAlarm);
      const ring = el.querySelector('.cc-marker-ring');
      if (ring) ring.style.borderColor = color;
      const dot = el.querySelector('.cc-marker-dot');
      if (dot) { dot.style.background = color; dot.style.boxShadow = `0 0 12px ${color}`; }
      const label = el.querySelector('.cc-marker-label');
      if (label) label.innerHTML = `${escapeHtml(dev.name)}${r ? `<br><span style="color:${color}">電壓 ${fmt(r.batVoltage, 1)}V · 發電 ${fmt(r.pvPower, 0)}W</span>` : ''}`;
    }
  }
}

// 旧 renderCard 仍保留供未来使用,但看板模式不调用


// ---------- Render: device card ----------
function alarmLevel(dev, reading) {
  // 0 = ok, 1 = warn, 2 = alarm
  if (!reading) return 0;

  // 1. 严重故障(硬件/温度/过载等非电压故障) — 永远 alarm
  if (reading.faultsCritical && reading.faultsCritical.length > 0) return 2;

  // 2. 用户配置的电压告警阈值 — alarm
  if (reading.batVoltage !== null && reading.batVoltage !== undefined &&
      dev.batVAlarmLow && reading.batVoltage < dev.batVAlarmLow) return 2;

  // 3. 控制器自报电压故障(欠压/过压等) — warn,让用户阈值说了算
  if (reading.faultsVoltage && reading.faultsVoltage.length > 0) return 1;

  // 4. 接近用户阈值(5% 上方) — warn
  if (reading.batVoltage !== null && dev.batVAlarmLow &&
      reading.batVoltage < dev.batVAlarmLow * 1.05) return 1;

  return 0;
}

function batteryPct(dev, voltage) {
  const lo = dev.batVMin || 9.3;
  const hi = dev.batVMax || 12.6;
  if (hi <= lo) return null;
  return clamp((voltage - lo) / (hi - lo) * 100, 0, 100);
}

// ============================================================
//  智能預測: 充滿時間 / 續航時間 / 陰天風險
// ============================================================

/**
 * 計算當前狀態下,把電池充滿(到 100%)還要多久。
 * @returns { hours, blocker?: string }  blocker 為 null 表示能充滿
 */
function predictTimeToFull(dev, reading) {
  if (!reading) return null;
  const pct = batteryPct(dev, reading.batVoltage);
  if (pct === null) return null;
  if (pct >= 99) return { hours: 0, blocker: null, alreadyFull: true };

  // 净充电电流(充电电流 - 负载电流的瞬时净额)
  // batCurrent 直接是控制器报告的电池净电流(充正放负)
  const netI = reading.batCurrent;
  if (netI <= 0.05) {
    return { hours: Infinity, blocker: netI < 0 ? '當前在放電' : '當前無充電電流' };
  }

  // 容量
  const capAh = dev.batCapacityAh || 100;
  const usable = dev.batUsableRatio || 0.9;
  const usableAh = capAh * usable;

  // 当前剩余可充电的容量(Ah) = usableAh × (100% - pct%)
  const remainingAh = usableAh * (1 - pct / 100);
  const hours = remainingAh / netI;
  return { hours, blocker: null, alreadyFull: false, netI, remainingAh };
}

/**
 * 計算當前負載下,電池能撐多久(到 0%/告警閾值)。
 * 假設沒有 PV 輸入(夜晚場景)。
 */
function predictTimeToEmpty(dev, reading) {
  if (!reading) return null;
  const pct = batteryPct(dev, reading.batVoltage);
  if (pct === null) return null;

  // 净电流(放电时为负)
  const netI = reading.batCurrent;
  // 純放電負載: 用當前負載電流(忽略 PV 已被內部抵銷)
  // 如果当前在充电,我们假設 PV 突然消失後負載電流不变
  const dischargeI = Math.max(reading.loadCurrent || 0, -netI);
  if (dischargeI <= 0.05) {
    return { hours: Infinity, blocker: '當前無負載' };
  }

  const capAh = dev.batCapacityAh || 100;
  const usable = dev.batUsableRatio || 0.9;
  const usableAh = capAh * usable;
  const remainingAh = usableAh * (pct / 100);
  const hours = remainingAh / dischargeI;
  return { hours, blocker: null, dischargeI, remainingAh };
}

// 即時資料按時間保留，避免 3 秒輪詢時 720 點只覆蓋 36 分鐘。
function appendHistoryPoint(deviceId, point) {
  const hist = State.history[deviceId] || (State.history[deviceId] = []);
  hist.push(point);
  const cutoff = point.t - HISTORY_WINDOW_MS;
  let expired = 0;
  while (expired < hist.length && hist[expired].t < cutoff) expired++;
  if (expired) hist.splice(0, expired);
  if (hist.length > HISTORY_MAX) hist.splice(0, hist.length - HISTORY_MAX);
}

// 每個站點快取最近 24 小時的 CSV；同時開啟面板時共用一次請求。
async function loadPredictionHistory(deviceId) {
  const cache = _predictionHistoryCache[deviceId] ||
    (_predictionHistoryCache[deviceId] = { points: [], loadedAt: null, attemptedAt: null, pending: null });
  if (cache.pending) return cache.pending;
  const now = Date.now();
  if (cache.loadedAt !== null && now - cache.loadedAt < PREDICTION_HISTORY_REFRESH_MS) return cache.points;
  if (cache.attemptedAt !== null && now - cache.attemptedAt < 30000) return cache.points;
  cache.attemptedAt = now;
  cache.pending = (async () => {
    try {
      const result = await fetchLog(deviceId, 50000, now - HISTORY_WINDOW_MS);
      if (!result.success) throw new Error(result.error || 'CSV fetch failed');
      cache.points = (result.rows || []).map(csvRowToPoint);
      cache.loadedAt = Date.now();
    } catch (e) {
      console.warn('Prediction history fetch failed:', e.message);
    }
    return cache.points;
  })().finally(() => { cache.pending = null; });
  return cache.pending;
}

// 面板保持開啟時亦會更新，讓新站點累積足夠資料後自動啟用預測。
function refreshVisiblePrediction(dev, reading) {
  if (State.openDrawerDevice !== dev.id) return;
  const visible = document.body.getAttribute('data-view') === 'device' ||
    document.getElementById('drawer')?.classList.contains('show');
  const mount = visible && _findPredictionMount();
  if (mount && mount.dataset.deviceId === dev.id &&
      Date.now() - Number(mount.dataset.refreshedAt || 0) >= 60000) {
    renderPredictionPanel(dev, reading);
  }
}

/** 合併 CSV 與即時樣本，按有效時間加權；不把密集的即時點當成較多小時。 */
function calcDailyEnergyBalance(deviceId) {
  const now = Date.now();
  const cutoff = now - HISTORY_WINDOW_MS;
  const byTime = new Map();
  const addPoint = (point) => {
    if (Number.isFinite(point.t) && point.t >= cutoff && point.t <= now &&
        Number.isFinite(point.pvP) && point.pvP >= 0 &&
        Number.isFinite(point.loadP) && point.loadP >= 0) {
      byTime.set(point.t, point);
    }
  };
  ((_predictionHistoryCache[deviceId] || {}).points || []).forEach(addPoint);
  (State.history[deviceId] || []).forEach(addPoint); // 相同時間優先採用即時完整讀值
  const recent = Array.from(byTime.values()).sort((a, b) => a.t - b.t);
  if (recent.length < 3) return null;

  let coveredMs = 0, pvWms = 0, loadWms = 0;
  for (let i = 1; i < recent.length; i++) {
    const prev = recent[i - 1], point = recent[i];
    const dt = point.t - prev.t;
    if (dt <= 0 || dt > PREDICTION_MAX_GAP_MS) continue;
    coveredMs += dt;
    pvWms += (prev.pvP + point.pvP) / 2 * dt;
    loadWms += (prev.loadP + point.loadP) / 2 * dt;
  }
  if (coveredMs < 60 * 60 * 1000) return null;
  const avgPvW = pvWms / coveredMs;
  const avgLoadW = loadWms / coveredMs;
  return {
    avgPvW,
    avgLoadW,
    netDailyWh: (avgPvW - avgLoadW) * 24,
    sampledHours: coveredMs / 3600000,
  };
}

function renderEnergyBalance(energy) {
  if (!energy) return '最近 24 小時內的有效歷史不足 1 小時，數據累積後會自動更新';
  return `最近 24 小時內 · 有效 ${fmt(energy.sampledHours, 1)} 小時 ·
    平均發電 <b style="color:var(--solar)">${fmt(energy.avgPvW, 0)} W</b> ·
    平均負載 <b style="color:var(--load)">${fmt(energy.avgLoadW, 0)} W</b> ·
    估算日淨能量 <b style="color:${energy.netDailyWh >= 0 ? 'var(--battery)' : 'var(--danger)'}">
      ${energy.netDailyWh >= 0 ? '+' : ''}${Math.round(energy.netDailyWh).toLocaleString('en')} Wh/日</b>`;
}

/**
 * 預測未來 3 天陰天斷電風險:
 *   - 基於歷史日均負載 + 天氣云量打折 PV
 *   - 模擬電量逐日变化
 */
function predictRainyRisk(dev, reading, weather) {
  if (!reading || !weather || !weather.forecast || weather.forecast.length === 0) return null;
  const pct = batteryPct(dev, reading.batVoltage);
  if (pct === null) return null;

  const capAh = dev.batCapacityAh || 100;
  const usable = dev.batUsableRatio || 0.9;
  const usableAh = capAh * usable;
  // 当前可用电量 (Ah)
  let availAh = usableAh * (pct / 100);

  const energy = calcDailyEnergyBalance(dev.id);
  if (!energy) return { insufficient: '最近 24 小時內的有效歷史不足 1 小時，暫未能計算斷電風險' };

  // 估算 12V 系统等效 Ah/天: P_avg * 24h / Vbat
  const vBat = reading.batVoltage || 12;

  // 每天的 PV 折扣: cloud_cover_mean 0=全晴(100%), 100=全阴(20%)
  const pvFactor = (cloud) => {
    if (cloud === null || cloud === undefined) return 1.0;
    // 简单线性: 0% 云 → 100%, 100% 云 → 20%
    return Math.max(0.2, 1 - cloud * 0.008);
  };

  const days = [];
  for (let i = 0; i < Math.min(3, weather.forecast.length); i++) {
    const day = weather.forecast[i];
    const factor = pvFactor(day.cloud_cover_mean);
    const pvAhThisDay   = (energy.avgPvW * factor) * 24 / vBat;
    const loadAhThisDay = energy.avgLoadW * 24 / vBat;
    const deltaAh = pvAhThisDay - loadAhThisDay;
    availAh += deltaAh;
    const pctEnd = clamp((availAh / usableAh) * 100, 0, 100);
    days.push({
      date: day.date,
      cloud: day.cloud_cover_mean,
      label: day.weather_label,
      quality: day.solar_quality,
      pvFactor: factor,
      deltaAh,
      pctEnd,
      depleted: availAh <= 0,
    });
    if (availAh <= 0) {
      // 後續日不再模擬,標記為已斷電
      availAh = 0;
    }
  }

  const anyDepleted = days.some(d => d.depleted);
  const lowestPct = Math.min(...days.map(d => d.pctEnd));

  return {
    days,
    anyDepleted,
    lowestPct,
    risk: anyDepleted ? 'high' : (lowestPct < 25 ? 'medium' : 'low'),
    energy,
  };
}

/**
 * 把小時數格式化成易讀字符串
 */
function fmtHours(h) {
  if (h === null || h === undefined) return '—';
  if (h === Infinity) return '∞';
  if (h < 1) return `${Math.round(h * 60)} 分`;
  if (h < 24) return `${h.toFixed(1)} 小時`;
  const days = Math.floor(h / 24);
  const remH = Math.round(h % 24);
  return remH > 0 ? `${days} 天 ${remH} 小時` : `${days} 天`;
}

// 從 bridge 拉天氣預報, 緩存 30 分鐘
async function fetchWeather(dev) {
  if (!dev.lat || !dev.lon) return null;
  const cached = State.weather[dev.id];
  if (cached && Date.now() - cached.fetchedAt < 30 * 60 * 1000) {
    return cached.forecast;
  }
  try {
    const r = await fetch(`/api/weather?lat=${dev.lat}&lon=${dev.lon}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'fetch failed');
    State.weather[dev.id] = {
      fetchedAt: Date.now(),
      forecast: d.forecast,
    };
    return d.forecast;
  } catch (e) {
    console.warn('Weather fetch failed for', dev.name, e.message);
    return null;
  }
}

/**
 * 渲染詳情面板的智能預測區
 */
async function renderPredictionPanel(dev, reading) {
  const mount = _findPredictionMount();
  const status = document.getElementById('predictionStatus');
  if (!mount) return;
  const requestToken = Symbol('prediction');
  mount._predictionRequest = requestToken;
  mount.dataset.deviceId = dev.id;
  mount.dataset.refreshedAt = String(Date.now());
  const isCurrent = () => mount.isConnected && mount._predictionRequest === requestToken;

  const pct = batteryPct(dev, reading.batVoltage);
  const toFull  = predictTimeToFull(dev, reading);
  const toEmpty = predictTimeToEmpty(dev, reading);
  const energy  = calcDailyEnergyBalance(dev.id);

  // 卡片样式生成器
  const card = (title, value, sub, color, icon) => `
    <div class="pred-card">
      <div class="pred-card-head">
        <span class="pred-icon" style="color:${color}">${icon}</span>
        <span class="pred-title">${title}</span>
      </div>
      <div class="pred-value" style="color:${color}">${value}</div>
      ${sub ? `<div class="pred-sub">${sub}</div>` : ''}
    </div>
  `;

  // 1. 充满还要多久
  let fillCard = '';
  if (toFull && toFull.alreadyFull) {
    fillCard = card('已充滿', '✓ 100%', '電池已達上限', 'var(--battery)', '🔋');
  } else if (toFull && toFull.blocker) {
    fillCard = card('充滿時間', '—', toFull.blocker, 'var(--text-3)', '⏳');
  } else if (toFull) {
    const sub = `當前 +${fmt(toFull.netI, 2)}A · 需充 ${fmt(toFull.remainingAh, 1)} Ah`;
    fillCard = card('充滿還需', fmtHours(toFull.hours), sub, 'var(--solar)', '⏳');
  }

  // 2. 续航多久
  let emptyCard = '';
  if (toEmpty && toEmpty.blocker) {
    emptyCard = card('續航時間', '—', toEmpty.blocker, 'var(--text-3)', '⏱');
  } else if (toEmpty) {
    const sub = `當前負載 ${fmt(toEmpty.dischargeI, 2)}A · 可用 ${fmt(toEmpty.remainingAh, 1)} Ah`;
    const c = toEmpty.hours < 4 ? 'var(--danger)' : toEmpty.hours < 12 ? 'var(--warn)' : 'var(--battery)';
    emptyCard = card('續航時間', fmtHours(toEmpty.hours), sub, c, '⏱');
  }

  // 3. 当前电量摘要
  const capAh = dev.batCapacityAh || 100;
  const usable = dev.batUsableRatio || 0.9;
  const availAh = (capAh * usable * (pct / 100));
  const summaryCard = card(
    '當前剩餘',
    `${Math.round(pct)}%`,
    `${fmt(availAh, 1)} / ${fmt(capAh * usable, 0)} Ah 可用`,
    pct < 30 ? 'var(--danger)' : pct < 60 ? 'var(--warn)' : 'var(--battery)',
    '🔋'
  );

  // 先渲染前 3 个,天气另外加载
  mount.innerHTML = `
    <div class="pred-grid">
      ${summaryCard}
      ${fillCard}
      ${emptyCard}
    </div>
    <div id="predictionWeatherMount"></div>
    <div class="pred-energy" id="predictionEnergyMount">${renderEnergyBalance(energy)}</div>
  `;
  const weatherMount = mount.querySelector('#predictionWeatherMount');
  const energyMount = mount.querySelector('#predictionEnergyMount');
  const historyPromise = loadPredictionHistory(dev.id).then(() => {
    if (isCurrent()) energyMount.innerHTML = renderEnergyBalance(calcDailyEnergyBalance(dev.id));
  });

  // 异步加载天气 + 风险预测
  if (!dev.lat || !dev.lon) {
    weatherMount.innerHTML = `
      <div class="pred-weather-empty">
        ⚠ 未設置站點經緯度,無法預測陰天風險。請在設置中填入經緯度。
      </div>
    `;
    if (status) status.textContent = '部分功能未啟用';
    return;
  }

  if (status) status.textContent = '加載天氣中…';
  const [forecast] = await Promise.all([fetchWeather(dev), historyPromise]);
  if (!isCurrent()) return;
  if (!forecast) {
    weatherMount.innerHTML = `
      <div class="pred-weather-empty">
        ⚠ 天氣數據獲取失敗 (網絡或 bridge 不支持)
      </div>
    `;
    if (status) status.textContent = '天氣加載失敗';
    return;
  }

  if (status) status.textContent = `${forecast.length} 天預報已加載`;
  const risk = predictRainyRisk(dev, reading, { forecast });
  weatherMount.innerHTML = renderWeatherRisk(risk, forecast);
}

function renderWeatherRisk(risk, forecast) {
  if (!risk || risk.insufficient) {
    return `
      <div class="pred-weather">
        <div class="pred-weather-head">未來 ${forecast.length} 天天氣</div>
        <div class="pred-weather-days">
          ${forecast.map(d => renderWeatherDay(d, null)).join('')}
        </div>
        <div class="pred-weather-empty" style="margin-top:10px">
          ⚠ ${risk ? risk.insufficient : '無法計算斷電風險'}
        </div>
      </div>
    `;
  }

  const riskBadge = {
    'low':    `<span class="risk-badge ok">✓ 風險低</span>`,
    'medium': `<span class="risk-badge warn">⚠ 風險中等 · 最低剩餘 ${Math.round(risk.lowestPct)}%</span>`,
    'high':   `<span class="risk-badge danger">⛔ 風險高 · 可能斷電!</span>`,
  }[risk.risk];

  return `
    <div class="pred-weather">
      <div class="pred-weather-head">
        <span>3 天斷電風險預測</span>
        ${riskBadge}
      </div>
      <div class="pred-weather-days">
        ${risk.days.map(d => renderWeatherDay(d, d)).join('')}
      </div>
      <div class="pred-weather-explain">
        基於近 24h 日均 ${fmt(risk.energy.avgPvW, 0)}W 發電 / ${fmt(risk.energy.avgLoadW, 0)}W 負載,
        按陰晴天氣折扣 PV 後逐日模擬
      </div>
    </div>
  `;
}

function renderWeatherDay(forecastDay, riskDay) {
  const cloud = forecastDay.cloud_cover_mean;
  const quality = forecastDay.solar_quality;
  const colorMap = { good: 'var(--battery)', fair: 'var(--warn)', poor: 'var(--danger)' };
  const iconMap = { good: '☀', fair: '⛅', poor: '☁' };
  const date = new Date(forecastDay.date);
  const dayLabel = ['日','一','二','三','四','五','六'][date.getDay()];
  return `
    <div class="weather-day ${quality}">
      <div class="wd-date">${date.getMonth()+1}/${date.getDate()} 週${dayLabel}</div>
      <div class="wd-icon" style="color:${colorMap[quality]}">${iconMap[quality]}</div>
      <div class="wd-label">${forecastDay.weather_label || '—'}</div>
      <div class="wd-cloud">雲量 ${cloud !== null ? cloud + '%' : '—'}</div>
      ${riskDay ? `
        <div class="wd-pct" style="color:${riskDay.pctEnd < 25 ? 'var(--danger)' : riskDay.pctEnd < 50 ? 'var(--warn)' : 'var(--battery)'}">
          ${riskDay.depleted ? '⛔ 斷電' : `剩 ${Math.round(riskDay.pctEnd)}%`}
        </div>
      ` : ''}
    </div>
  `;
}

/**
 * 紧凑模式渲染器 - 用于主页站点列表
 */
function renderCompactRow(dev) {
  const d = State.data[dev.id] || {};
  const r = d.lastReading;
  const card = $('card-' + dev.id);
  if (!card) return;

  const offline = !dev.enabled || (d.failCount >= FAILS_TO_OFFLINE) || !r;

  card.classList.toggle('offline', offline);
  card.classList.remove('alarm', 'warn');

  let level = 0;
  if (!offline) {
    level = alarmLevel(dev, r);
    if (level === 2) card.classList.add('alarm');
    else if (level === 1) card.classList.add('warn');
  }

  // LED
  const led = card.querySelector('.compact-led');
  led.classList.remove('online', 'warn', 'alarm', 'offline');
  if (offline)         led.classList.add('offline');
  else if (level === 2) led.classList.add('alarm');
  else if (level === 1) led.classList.add('warn');
  else                  led.classList.add('online');

  // Status pill
  const pill = card.querySelector('.compact-status-pill');
  pill.classList.remove('online', 'warn', 'alarm', 'offline');
  if (offline) {
    pill.classList.add('offline');
    pill.textContent = !dev.enabled ? '禁用' : '離線';
  } else if (level === 2) {
    pill.classList.add('alarm');
    pill.textContent = '告警';
  } else if (level === 1) {
    pill.classList.add('warn');
    pill.textContent = '注意';
  } else {
    pill.classList.add('online');
    pill.textContent = '在線';
  }

  // 中间指标区
  const mount = card.querySelector('.compact-mount');
  if (offline) {
    const msg = !dev.enabled ? '已停用' : (d.lastUpdate ? '失去聯繫' : '尚未取得數據');
    const err = d.lastError ? ` (${escapeHtml(d.lastError)})` : '';
    mount.innerHTML = `<div class="compact-offline-msg">${msg}${err}</div>`;
    return;
  }

  // 在线: 显示 4 个核心指标
  const pct = batteryPct(dev, r.batVoltage);
  const batCls = level === 2 ? 'bat-alarm' : (level === 1 ? 'bat-warn' : 'bat');
  mount.innerHTML = `
    <div class="compact-metric">
      <div class="lab">電池</div>

      <div class="sub">${pct !== null ? Math.round(pct) + '%' : ''} · ${r.batCurrent >= 0 ? '+' : ''}${fmt(r.batCurrent, 1)}A</div>
    </div>
    <div class="compact-metric">
      <div class="lab">PV 充電</div>
      <div class="val pv">${fmt(r.pvPower, 0)} <span style="font-size:11px;color:var(--text-2)">W</span></div>
      <div class="sub">${fmt(r.pvVoltage, 1)}V · ${fmt(r.pvCurrent, 1)}A</div>
    </div>
    <div class="compact-metric">
      <div class="lab">負載</div>
      <div class="val load">${fmt(r.loadPower, 0)} <span style="font-size:11px;color:var(--text-2)">W</span></div>
      <div class="sub">${r.stage || '—'}</div>

      <div class="sub">${r.envTemp ? fmt(r.envTemp, 0) + '°C' : ''}</div>

// ---------- In-card mini charts ----------
const cardCharts = {};   // deviceId → Chart instance

function updateCardChart(deviceId) {
  const card = document.getElementById('card-' + deviceId);
  if (!card) return;
  const chartEl = card.querySelector('.card-chart');
  if (!chartEl) return;
  const wrap = chartEl.querySelector('[data-canvas-wrap]');
  const ptsEl = chartEl.querySelector('[data-points]');
  const history = State.history[deviceId] || [];
  const data = downsample(history, 600);

  if (ptsEl) ptsEl.textContent = history.length + ' pts';

  if (data.length < 2) {
    // 没有足够数据,显示提示
    wrap.innerHTML = '<div class="card-chart-empty">累積中…需至少 2 個數據點</div>';
    if (cardCharts[deviceId]) {
      cardCharts[deviceId].destroy();
      delete cardCharts[deviceId];
    }
    return;
  }

  // 确保 canvas 存在
  if (!wrap.querySelector('canvas')) {
    wrap.innerHTML = '<canvas></canvas>';
    if (cardCharts[deviceId]) {
      cardCharts[deviceId].destroy();
      delete cardCharts[deviceId];
    }
  }
  const canvas = wrap.querySelector('canvas');

  if (typeof Chart === 'undefined') return;

  if (!cardCharts[deviceId]) {
    cardCharts[deviceId] = new Chart(canvas, {
      type: 'line',
      data: {
        labels: data.map(p => p.t),
        datasets: [
          {
            data: data.map(p => p.pvP),
            borderColor: '#f5a524',
            backgroundColor: 'rgba(245,165,36,0.10)',
            fill: true, tension: 0.3, pointRadius: 0, borderWidth: 1.8, yAxisID: 'y',
          },
          {
            data: data.map(p => p.loadP),
            borderColor: '#06b6d4',
            backgroundColor: 'rgba(6,182,212,0.08)',
            fill: true, tension: 0.3, pointRadius: 0, borderWidth: 1.8, yAxisID: 'y',
          },
          {
            data: data.map(p => p.batV),
            borderColor: '#22c55e',
            tension: 0.3, pointRadius: 0, borderWidth: 1.2, borderDash: [3, 3], yAxisID: 'y1',
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0f1115', borderColor: '#353c52', borderWidth: 1, padding: 8,
            displayColors: true, boxWidth: 8, boxHeight: 2,
            callbacks: {
              title: (items) => items.length ? new Date(parseInt(items[0].label)).toLocaleTimeString() : '',
              label: (ctx) => {
                const labels = ['PV', '負載', '電池'];
                const u = ctx.dataset.yAxisID === 'y1' ? 'V' : 'W';
                return `${labels[ctx.datasetIndex]}: ${ctx.parsed.y == null ? '—' : ctx.parsed.y.toFixed(2)} ${u}`;
              },
            },
          },
        },
        scales: {
          y: { display: false, beginAtZero: true },
          y1: { display: false },
          x: { display: false },
        },
      },
    });
  } else {
    const c = cardCharts[deviceId];
    c.data.labels = data.map(p => p.t);
    c.data.datasets[0].data = data.map(p => p.pvP);
    c.data.datasets[1].data = data.map(p => p.loadP);
    c.data.datasets[2].data = data.map(p => p.batV);
    c.update('none');
  }
}

function renderAllCards() {
  const route = parseHashRoute();
  if (route.view === 'settings') {
    renderSettingsView(route);
    renderTopStats();
    return;
  }
  if ($('settingsPage').classList.contains('show')) SettingsUI.mounted = false;
  $('settingsPage').hidden = true;
  $('settingsPage').classList.remove('show');
  $('btnSettings').removeAttribute('aria-current');
  if (route.view === 'device') {
    renderDeviceView(route.deviceId);
  } else {
    renderDashboardView();
  }
  renderTopStats();
}

function parseHashRoute() {
  // Routes: dashboard, device detail and full-page settings.
  const h = location.hash || '';
  const settings = h.match(/^#\/settings(?:\/([^/?#]+))?\/?$/);
  if (settings) return { view: 'settings', section: SETTINGS_SECTIONS.includes(settings[1]) ? settings[1] : 'sizing' };
  const m = h.match(/^#\/device\/(.+)$/);
  if (m) return { view: 'device', deviceId: decodeURIComponent(m[1]) };
  return { view: 'dashboard' };
}

function navigateToDevice(deviceId) {
  location.hash = '#/device/' + encodeURIComponent(deviceId);
}
function navigateToDashboard() {
  if (location.hash) location.hash = '';
  else renderAllCards();
}
window.addEventListener('hashchange', () => renderAllCards());

// ============ NVR 在線狀態面板 ============
let _nvrRefreshTimer = null;
async function initNvrStatusPanel() {
  if (_nvrRefreshTimer) clearInterval(_nvrRefreshTimer);
  await refreshNvrStatus();
  // 每 30 秒刷一次 (bridge 每 60 秒探測, 前端 30 秒 poll cache 保持顯示新鮮)
  _nvrRefreshTimer = setInterval(refreshNvrStatus, 30000);
}

async function refreshNvrStatus() {
  const list = document.getElementById('nvrStatusList');
  const meta = document.getElementById('nvrMeta');
  if (!list) return;
  try {
    const res = await fetch('/api/nvr_status');
    const d = await res.json();
    if (!d.success) throw new Error(d.error || 'unknown');
    if (meta) {
      meta.innerHTML = `<span style="color:var(--battery)">在線 ${d.online_count}</span> · ` +
                       `<span style="color:var(--danger)">離線 ${d.offline_count}</span>` +
                       (d.unconfigured_count ? ` · <span style="color:var(--text-3)">未配置 ${d.unconfigured_count}</span>` : '');
    }
    if (!d.devices || d.devices.length === 0) {
      list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-3);font-size:12px">未有站點</div>';
      return;
    }
    list.innerHTML = d.devices.map(dev => {
      let stClass, stLabel, stHint;
      if (dev.online === true) {
        stClass = 'online'; stLabel = '● 在線'; stHint = '';
      } else if (dev.online === false) {
        stClass = 'offline'; stLabel = '● 離線'; stHint = dev.err || '無回應';
      } else {
        stClass = 'unconfig'; stLabel = '○ 未配置'; stHint = '';
      }
      // 安全考慮: 唔顯示 NVR IP:port, 只顯示狀態
      // 未配置嘅顯示提示, 有錯就顯示錯誤原因
      const subLine = dev.online === null && !dev.nvr_host
        ? '未設定 IP'
        : (dev.online === false ? (stHint || '無回應') : '連接正常');
      return `
        <div class="nvr-item ${stClass}">
          <div class="nvr-row1">
            <span class="nvr-name">${escapeHtml(dev.name)}</span>
            <span class="nvr-status">${stLabel}</span>
          </div>
          <div class="nvr-row2">
            <span class="nvr-sub">${escapeHtml(subLine)}</span>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--danger);font-size:12px">加載失敗: ${escapeHtml(e.message || '')}</div>`;
  }
}

  if (!offline) level = alarmLevel(dev, r);
  const klass = offline ? 'offline' :
                level === 2 ? 'alarm' :

  if (offline) {
    return `

// 事件流(从最近告警和数据点推断)
function renderEventStream() {
  const events = [];
  // 当前告警
  for (const dev of State.devices) {
    const d = State.data[dev.id];
    if (!d || !d.lastReading) continue;
    const r = d.lastReading;
    const lvl = alarmLevel(dev, r);
    if (lvl === 2) {
      if (r.faultsCritical && r.faultsCritical.length) {
        events.push({ time: d.lastUpdate, severity: 'alarm', msg: `${dev.name}: ${r.faultsCritical[0]}` });
      } else if (r.batVoltage < dev.batVAlarmLow) {
        events.push({ time: d.lastUpdate, severity: 'alarm', msg: `${dev.name}: 電池欠壓 ${fmt(r.batVoltage,2)}V (閾值 ${dev.batVAlarmLow}V)` });
      }
    } else if (lvl === 1) {
      const f = r.faultsVoltage && r.faultsVoltage.length ? r.faultsVoltage[0] : '接近電壓閾值';
      events.push({ time: d.lastUpdate, severity: 'warn', msg: `${dev.name}: ${f}` });
    }
  }
  // 离线设备
  for (const dev of State.devices) {
    const d = State.data[dev.id];
    if (!dev.enabled) continue;
    if (d && d.failCount >= FAILS_TO_OFFLINE) {
      events.push({ time: d.lastUpdate || Date.now(), severity: 'alarm', msg: `${dev.name}: 失去連線` });
    }
  }
  if (events.length === 0) {
    return '<div class="event-empty">當前無告警事件 ✓</div>';
  }
  // 按时间倒序
  events.sort((a, b) => (b.time || 0) - (a.time || 0));
  return events.slice(0, 20).map(e => `
    <div class="event-row ${e.severity}">
      <span class="event-time">${e.time ? new Date(e.time).toTimeString().slice(0, 5) : '--:--'}</span>
      <span class="event-msg">${escapeHtml(e.msg)}</span>
    </div>
  `).join('');
}

// 24h 总功率趋势图(全站点 PV+Load 汇总) — chart 实例在下面 initDashTrendChart 上面声明
// ============================================================
//  Site Map - Leaflet 香港地圖 + 5 站點標記
// ============================================================
let _siteMap = null;
let _siteMarkers = [];

function initSiteMap() {
  const el = document.getElementById('ccMap');
  if (!el || typeof L === 'undefined') return;
  if (_siteMap) {
    _siteMap.remove();
    _siteMap = null;
    _siteMarkers = [];
  }
  // 清舊 resize handler, 避免累積
  if (_siteMapResizeHandler) {
    window.removeEventListener('resize', _siteMapResizeHandler);
    _siteMapResizeHandler = null;
  }

  // 香港地理範圍: [南西, 北東]
  // 南 22.13 (蒲台島) / 北 22.58 (打鼓嶺) / 西 113.82 (大嶼山) / 東 114.45 (西貢東)
  const HK_BOUNDS = L.latLngBounds([22.13, 113.82], [22.58, 114.45]);

  _siteMap = L.map(el, {
    zoomControl: true,
    attributionControl: false,
    preferCanvas: true,
    maxBounds: HK_BOUNDS,          // 拖唔出香港範圍
    maxBoundsViscosity: 1.0,       // 拖到邊界完全彈返, 唔會鬆手先彈
    minZoom: 10,                   // 縮唔到見中國/南海全景
    maxZoom: 17,                   // 放大限制, 避免太深 tile 放大過分
  }).setView([22.35, 114.13], 11);

  // OpenStreetMap 官方 tile (永久免费, 无需 API key, 无到期风险)
  // 顶部 CSS filter 会把彩色 tile 转成深色, 保持原 HUD 风格
  // 冇加 bounds — 令 tile 可以填滿整個 container (深圳/廣東/南海邊緣都會 render)
  // 用戶拖唔出去係靠 maxBounds 控制, 唔靠 tile 層限制
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    minZoom: 10,
    maxZoom: 17,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(_siteMap);

  // 添加站点标记
  const devicesWithLoc = State.devices.filter(d => d.lat && d.lon);
  if (devicesWithLoc.length === 0) {
    // 没有任何站点定位,显示提示
    const tip = L.popup({ closeButton: false, autoClose: false, closeOnClick: false })
      .setLatLng([22.30, 114.17])
      .setContent('<div style="color:#aab8c7;font-family:monospace;font-size:11px">未定位任何站點<br>請在「⚙ 設置」中填入經緯度</div>')
      .openOn(_siteMap);
    return;
  }

  for (const dev of devicesWithLoc) {
    const d = State.data[dev.id] || {};
    const r = d.lastReading;
    const offline = !dev.enabled || (d.failCount >= FAILS_TO_OFFLINE) || !r;
    const level = !offline ? alarmLevel(dev, r) : -1;
    const color = offline ? '#6c7689' :
                  level === 2 ? '#ef4444' :
                  level === 1 ? '#fbbf24' :
                  '#22c55e';
    const isAlarm = !offline && level === 2;

    // 自定义图标: 发光圆点 (label 位置 pos-bottom 默认,后面会按需调整)
    const icon = L.divIcon({
      className: 'cc-marker',
      html: `
        <div class="cc-marker-wrap ${isAlarm ? 'alarm' : ''}">
          <div class="cc-marker-ring" style="border-color:${color}"></div>
          <div class="cc-marker-dot" style="background:${color};box-shadow:0 0 12px ${color}"></div>
          <div class="cc-marker-label pos-bottom">${escapeHtml(dev.name)}${r ? `<br><span style="color:${color}">電壓 ${fmt(r.batVoltage, 1)}V · 發電 ${fmt(r.pvPower, 0)}W</span>` : ''}</div>
        </div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8],
    });

    const marker = L.marker([dev.lat, dev.lon], { icon }).addTo(_siteMap);
    marker._tySolarDevId = dev.id;
    marker._tySolarColor = color;
    marker.on('click', () => navigateToDevice(dev.id));
    _siteMarkers.push(marker);
  }

  // 自动 fit 到所有标记 (加 invalidateSize 修 DOM 未 layout 的 bug)
  if (_siteMarkers.length > 0) {
    const doFit = () => {
      _siteMap.invalidateSize({ animate: false });   // 強制重算 map 容器 size
      const bounds = L.featureGroup(_siteMarkers).getBounds();
      _siteMap.fitBounds(bounds, {
        // 上左右留 70px, 底部留 150px 畀 marker 標籤空間 (marker 標籤朝下)
        paddingTopLeft: [70, 70],
        paddingBottomRight: [70, 150],
        maxZoom: 12,          // 保守 zoom, 避免 marker 貼近邊緣
        animate: false,
      });
    };
    // 首次 fit (等 DOM 完全 layout)
    setTimeout(doFit, 100);
    // 200ms 後再 fit 一次 (以防 DOM 仍未穩定)
    setTimeout(doFit, 300);
    // window resize 監聽 (應對用戶調 browser 尺寸)
    if (!_siteMapResizeHandler) {
      _siteMapResizeHandler = () => {
        if (_siteMap && _siteMarkers.length > 0) doFit();
      };
      window.addEventListener('resize', _siteMapResizeHandler);
    }
    // ResizeObserver 監聽 map container 本身尺寸
    // — 用嚟捕捉「天氣加載完成後 flex 空間縮矮」呢類 window 冇變但 container 縮咗嘅情況
    if (window.ResizeObserver && !el._siteMapObserver) {
      let lastH = el.clientHeight, lastW = el.clientWidth;
      const ro = new ResizeObserver(() => {
        if (!_siteMap || _siteMarkers.length === 0) return;
        // debounce: 至少 3px 差先算, 避免 sub-pixel 抖動
        if (Math.abs(el.clientHeight - lastH) < 3 && Math.abs(el.clientWidth - lastW) < 3) return;
        lastH = el.clientHeight; lastW = el.clientWidth;
        doFit();
        setTimeout(() => resolveMarkerLabelPositions(), 100);
      });
      ro.observe(el);
      el._siteMapObserver = ro;
    }
    // fit 完成后才能 latLngToContainerPoint, 等下一帧
    setTimeout(() => resolveMarkerLabelPositions(), 500);
    // 拖动/缩放后重新分配 label 位置
    _siteMap.on('zoomend moveend', () => resolveMarkerLabelPositions());
  }
}
let _siteMapResizeHandler = null;

// label 位置防重叠: 计算每个 marker 在屏幕上的像素位置,
// 如果两两距离 < 阈值, 给后一个换方向 (下→上→右→左)
// 另外: 貼近 map 邊界時, 強制換方向避免 label 越界
function resolveMarkerLabelPositions() {
  if (!_siteMap || _siteMarkers.length === 0) return;
  const mapSize = _siteMap.getSize();  // {x: width, y: height}
  const EDGE_BUFFER = 60;   // 距離邊界少於呢個 px 就避開嗰個方向

  const positions = _siteMarkers.map(m => {
    const ll = m.getLatLng();
    const pt = _siteMap.latLngToContainerPoint(ll);
    return { marker: m, x: pt.x, y: pt.y, dir: 'pos-bottom' };
  });

  const DIRS = ['pos-bottom', 'pos-top', 'pos-right', 'pos-left'];
  const THRESHOLD = 140;

  for (let i = 0; i < positions.length; i++) {
    const a = positions[i];

    // 檢測邊界: 該 marker 靠近邊時哪些方向不能用
    const forbiddenDirs = new Set();
    if (a.y > mapSize.y - EDGE_BUFFER) forbiddenDirs.add('pos-bottom');  // 貼底
    if (a.y < EDGE_BUFFER) forbiddenDirs.add('pos-top');                  // 貼頂
    if (a.x > mapSize.x - EDGE_BUFFER) forbiddenDirs.add('pos-right');   // 貼右
    if (a.x < EDGE_BUFFER) forbiddenDirs.add('pos-left');                // 貼左

    // 檢測與前面 marker 重疊嘅方向
    const usedDirs = new Set();
    for (let j = 0; j < i; j++) {
      const b = positions[j];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (dist < THRESHOLD) usedDirs.add(b.dir);
    }

    // 選一個唔被 forbidden 又唔被 used 嘅方向
    const allBad = new Set([...forbiddenDirs, ...usedDirs]);
    a.dir = DIRS.find(d => !allBad.has(d))
         || DIRS.find(d => !forbiddenDirs.has(d))   // 二次選: 淨係避開邊界
         || DIRS.find(d => !usedDirs.has(d))         // 三次選: 淨係避開重疊
         || 'pos-bottom';                             // 最後兜底
  }

  // 应用到 DOM
  for (const p of positions) {
    const el = p.marker.getElement();
    if (!el) continue;
    const label = el.querySelector('.cc-marker-label');
    if (!label) continue;
    DIRS.forEach(d => label.classList.remove(d));
    label.classList.add(p.dir);
  }
}

// 1 小時自動刷新一次天氣 (全局 timer, 避免重複設定)
let _weatherRefreshTimer = null;
async function initWeatherPanel() {
  // 設置全局自動刷新 (1 小時 = 3600000 ms)
  if (_weatherRefreshTimer === null) {
    _weatherRefreshTimer = setInterval(() => {
      // 只在主看板顯示時刷新, 避免在詳情頁時無謂網絡請求
      const dashView = document.getElementById('viewDashboard');
      if (dashView && dashView.style.display !== 'none' && document.getElementById('ccWeatherPanel')) {
        initWeatherPanel();
      }
    }, 3600000);
  }

  const panel = document.getElementById('ccWeatherPanel');
  const meta = document.getElementById('ccWeatherMeta');
  if (!panel) return;

  // 优先用第一个有经纬度的设备坐标; 没有就用香港中心
  const devWithLoc = State.devices.find(d => d.lat && d.lon);
  const lat = devWithLoc ? devWithLoc.lat : 22.3193;
  const lon = devWithLoc ? devWithLoc.lon : 114.1694;
  const locName = devWithLoc ? devWithLoc.name : '香港';

  try {
    const r = await fetch(`/api/weather?lat=${lat}&lon=${lon}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'fetch failed');
    const forecast = d.forecast || [];
    if (forecast.length === 0) throw new Error('無預報數據');

    if (meta) meta.textContent = `${locName} · ${d.cached ? '緩存' : '實時'} · 每小時自動刷新`;

    panel.innerHTML = `
      <div class="cc-weather-days">
        ${forecast.map((day, i) => renderCCWeatherDay(day, i === 0)).join('')}
      </div>
      <div class="cc-weather-tip">
        ${renderWeatherTip(forecast)}
      </div>
    `;
  } catch (e) {
    if (meta) meta.textContent = '加載失敗';
    panel.innerHTML = `
      <div class="cc-weather-loading" style="color:var(--text-3)">
        ⚠ 天氣數據獲取失敗<br>
        <span style="font-size:11px">${escapeHtml(e.message)} — 請確認 bridge 可訪問 open-meteo.com</span>
      </div>`;
  }
}

function renderCCWeatherDay(day, isToday) {
  const cloud = day.cloud_cover_mean;
  const quality = day.solar_quality;  // good/fair/poor
  const colorMap = { good: 'var(--battery)', fair: 'var(--warn)', poor: 'var(--danger)' };
  const iconMap = { good: '☀', fair: '⛅', poor: '☁' };
  const qualityLabel = { good: '發電佳', fair: '發電中等', poor: '發電差' };
  const date = new Date(day.date);
  const dayLabel = ['日','一','二','三','四','五','六'][date.getDay()];
  const dateStr = isToday ? '今天' : `${date.getMonth()+1}/${date.getDate()} 週${dayLabel}`;

  return `
    <div class="cc-wday ${quality}">
      <div class="cc-wday-date">${dateStr}</div>
      <div class="cc-wday-icon" style="color:${colorMap[quality]}">${iconMap[quality]}</div>
      <div class="cc-wday-label">${day.weather_label || '—'}</div>
      <div class="cc-wday-temp">${day.temp_min != null ? Math.round(day.temp_min) : '—'}° ~ ${day.temp_max != null ? Math.round(day.temp_max) : '—'}°</div>
      <div class="cc-wday-detail">
        <div class="wd-row"><span>雲量</span><span>${cloud != null ? cloud + '%' : '—'}</span></div>
        <div class="wd-row"><span>日照</span><span>${day.sunshine_hours != null ? day.sunshine_hours + 'h' : '—'}</span></div>
        <div class="wd-row"><span>降雨</span><span>${day.precipitation_mm != null ? day.precipitation_mm + 'mm' : '—'}</span></div>
      </div>
      <div class="cc-wday-solar" style="color:${colorMap[quality]};border-color:${colorMap[quality]}">${qualityLabel[quality]}</div>
    </div>
  `;
}

// 根据未来几天天气给个总结提示
function renderWeatherTip(forecast) {
  const next3 = forecast.slice(0, 3);
  const poorDays = next3.filter(d => d.solar_quality === 'poor').length;
  const fairDays = next3.filter(d => d.solar_quality === 'fair').length;

  if (poorDays >= 2) {
    return `<span style="color:var(--danger)">⚠ 未來 3 天有 ${poorDays} 天陰雨,發電量會明顯下降,請留意各站點電量,必要時減少負載。</span>`;
  } else if (poorDays === 1 || fairDays >= 2) {
    return `<span style="color:var(--warn)">⛅ 未來幾天天氣一般,發電量中等,建議關注電量較低的站點。</span>`;
  } else {
    return `<span style="color:var(--battery)">☀ 未來幾天天氣良好,發電條件理想。</span>`;
  }
}

// ============================================================
//  (舊) 24h 总功率趋势图 — 已停用, 函数保留备用
// ============================================================
let _dashTrendChart = null;
function initDashTrendChart() {
  const canvas = document.getElementById('dashTrendChart');
  if (!canvas || typeof Chart === 'undefined') return;
  if (_dashTrendChart) { _dashTrendChart.destroy(); _dashTrendChart = null; }

  // 聚合所有设备最近 24h 的 PV/Load(分桶到每 10 分钟)
  const cutoff = Date.now() - 24 * 60 * 60 * 1000;
  const bucketMs = 10 * 60 * 1000;
  const buckets = {};   // t → { pv, load, n }

  for (const dev of State.devices) {
    const hist = State.history[dev.id] || [];
    for (const p of hist) {
      if (p.t < cutoff) continue;
      const bk = Math.floor(p.t / bucketMs) * bucketMs;
      if (!buckets[bk]) buckets[bk] = { pv: 0, load: 0, n: 0 };
      buckets[bk].pv   += p.pvP || 0;
      buckets[bk].load += p.loadP || 0;
      buckets[bk].n++;
    }
  }
  const keys = Object.keys(buckets).map(Number).sort();
  const data = keys.map(k => ({
    t: k,
    pv: buckets[k].pv / (buckets[k].n / State.devices.length || 1),  // 该 bucket 全站汇总
    load: buckets[k].load / (buckets[k].n / State.devices.length || 1),
  }));

  $('dashTrendMeta').textContent = `${data.length} 點 · ${data.length > 0 ? '近 24h' : '數據累積中'}`;

  Chart.defaults.color = '#aab8c7';
  Chart.defaults.borderColor = '#2a3050';
  Chart.defaults.font.family = "'JetBrains Mono', monospace";
  Chart.defaults.font.size = 10;

  _dashTrendChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: data.map(p => p.t),
      datasets: [
        { label: 'PV 總和', data: data.map(p => p.pv),   borderColor: '#f5a524', backgroundColor: 'rgba(245,165,36,0.1)', fill: true, tension: 0.25, pointRadius: 0, borderWidth: 2 },
        { label: '負載總和', data: data.map(p => p.load), borderColor: '#06b6d4', backgroundColor: 'rgba(6,182,212,0.08)', fill: true, tension: 0.25, pointRadius: 0, borderWidth: 2 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', align: 'end', labels: { boxWidth: 10, padding: 8, font: { size: 10 } } },
        tooltip: {
          backgroundColor: '#111524', borderColor: '#3d4670', borderWidth: 1, padding: 10,
          callbacks: { title: (i) => i.length ? new Date(parseInt(i[0].label)).toLocaleString() : '' },
        },
      },
      scales: {
        x: { type: 'category', grid: { display: false }, ticks: { maxTicksLimit: 8, callback: (_, idx) => {
          const t = data[idx]?.t; return t ? new Date(t).toTimeString().slice(0,5) : '';
        }}},
        y: { beginAtZero: true, grid: { color: '#1a2540' }, title: { display: true, text: 'W', color: '#aab8c7' } },
      },
    },
  });
}

  const r = d.lastReading;
  const offline = !dev.enabled || (d.failCount >= FAILS_TO_OFFLINE) || !r;
  const level = !offline ? alarmLevel(dev, r) : -1;

  // 头部 + 容器
  mount.innerHTML = `
    <div class="dv-head">

      <div class="dv-title">
        <span class="led ${ledCls}"></span>

        <span class="dv-host">${escapeHtml(dev.host)}:${dev.port} · slave ${dev.slaveId}</span>
      </div>
      <div class="dv-head-right">
        <span class="dv-update">${d.lastUpdate ? '最後 ' + new Date(d.lastUpdate).toTimeString().slice(0,8) : ''}</span>

      </div>
    </div>
    <div class="dv-body" id="devviewBody"></div>
  `;
  mount.querySelector('[data-edit-dev]').addEventListener('click', () => openSettings(dev.id));

  if (offline || !r) {
    // 離線: 唔再淨係顯示「失去聯繫」, 而係保留歷史記錄(CSV)畀睇
    $('devviewBody').innerHTML = `
      <div class="dv-offline-banner">
        <span class="dv-offline-ic">⚠</span>
        <div>
          <div class="dv-offline-msg">${!dev.enabled ? '此站點已停用' : (d.lastUpdate ? '站點目前離線 · 失去聯繫' : '站點尚未取得實時數據')}</div>
          <div class="dv-offline-sub">${d.lastUpdate ? '最後一次聯繫: ' + new Date(d.lastUpdate).toLocaleString() : '以下為歷史 CSV 記錄'}${d.lastError ? ' · ' + escapeHtml(d.lastError) : ''}</div>
        </div>
      </div>

      <!-- 歷史發電/用電柱狀圖(離線都睇到, 數據嚟自 CSV) -->
      <div class="dv-section">
        <div class="dv-section-head">
          <span class="dv-section-title">歷史發電 / 用電</span>
          <div class="dv-range-tabs" id="dvDailyRangeTabs">
            <button data-days="7" class="active">近 7 天</button>
            <button data-days="15">近 15 天</button>
            <button data-days="30">近 30 天</button>
          </div>
        </div>
        <div id="dvDailyNote" style="font-size:11px;line-height:1.6;color:var(--text-3);margin-bottom:10px">香港時間 00:00 起計 · 功率積分估算（Wh）</div>
      <div class="dv-chart-wrap">
        <canvas id="dvDailyChart"></canvas>
          <div id="dvDailyLoading" class="dv-chart-loading">加載中…</div>
        </div>
      </div>

      <!-- 歷史功率走勢(離線都睇到, CSV) -->
      <div class="dv-section">
        <div class="dv-section-head">
          <span class="dv-section-title">歷史功率走勢</span>
          <select id="histRange" class="dv-range-select">
            <optgroup label="歷史 (CSV)">
              <option value="24h">近 24 小時</option>
              <option value="7d" selected>近 7 天</option>
              <option value="30d">近 30 天</option>
              <option value="csv-all">全部 CSV</option>
            </optgroup>
          </select>
        </div>
        <div class="dv-chart-wrap" style="height:240px">
          <canvas id="historyChart"></canvas>
        </div>
      </div>

      <!-- 系統信息 -->
      <div class="dv-section dv-section-mini">
        <div class="dv-section-head">
          <span class="dv-section-title">站點信息</span>
          <a href="/api/log_download?deviceId=${encodeURIComponent(deviceId)}&deviceName=${encodeURIComponent(dev.name)}" class="dv-mini-btn" download style="text-decoration:none;display:inline-block">⬇ 下載 CSV</a>
        </div>
        <div class="dv-kv-grid">
          <div class="kv"><span class="k">主機</span><span class="v">${escapeHtml(dev.host)}:${dev.port}</span></div>
          <div class="kv"><span class="k">從站 ID</span><span class="v">${dev.slaveId}</span></div>
          <div class="kv"><span class="k">最後聯繫</span><span class="v">${d.lastUpdate ? new Date(d.lastUpdate).toLocaleString() : '從未'}</span></div>
          <div class="kv"><span class="k">電池容量</span><span class="v">${dev.batCapacityAh || 100} Ah</span></div>
          <div class="kv"><span class="k">CSV 記錄</span><span class="v" id="log-status-${deviceId}">…</span></div>
          <div class="kv"><span class="k">電池量程</span><span class="v">${fmt(dev.batVMin, 1)} ~ ${fmt(dev.batVMax, 1)} V</span></div>

    `;

    // 即使離線都初始化圖表(CSV 數據)
    State.openDrawerDevice = deviceId;
    State.globalSettings.historyRange = '7d';
    setTimeout(() => initDrawerChart(), 50);
    setTimeout(() => loadDailyEnergyChart(deviceId, 7), 200);

    // 範圍切換
    const histRange = document.getElementById('histRange');
    if (histRange) {
      histRange.addEventListener('change', e => {
        State.globalSettings.historyRange = e.target.value;
        updateDrawerChart();
      });
    }
    document.querySelectorAll('#dvDailyRangeTabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#dvDailyRangeTabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadDailyEnergyChart(deviceId, parseInt(btn.dataset.days));
      });
    });
    refreshLogStatus(deviceId);
    return;
  }

  // 计算预测摘要(供折叠摘要行使用)
  const pct = batteryPct(dev, r.batVoltage);
  const toFull = predictTimeToFull(dev, r);
  const toEmpty = predictTimeToEmpty(dev, r);
  let summaryParts = [];
  summaryParts.push(`<span style="color:${pct < 30 ? 'var(--danger)' : pct < 60 ? 'var(--warn)' : 'var(--battery)'}">${Math.round(pct || 0)}%</span>`);
  if (toFull) {
    if (toFull.alreadyFull) summaryParts.push('已充滿');
    else if (toFull.blocker) summaryParts.push(`充滿: ${toFull.blocker}`);
    else summaryParts.push(`充滿 ${fmtHours(toFull.hours)}`);
  }
  if (toEmpty) {
    if (toEmpty.blocker) summaryParts.push(`續航: ${toEmpty.blocker}`);

// ============================================================
//  香港日曆日能量：實測功率 × 有效時間，原始控制器計數保持不變
// ============================================================
const ENERGY_DAY_MS = 86400000;
const ENERGY_HK_OFFSET_MS = 8 * 3600000;
const DAILY_ENERGY_MAX_GAP_MS = 90 * 60000; // CSV 通常每 30 分鐘記錄，較長斷線不補算
let _dailyChart = null;
let _dailyChartRequest = 0;

function hkEnergyDateKey(ts) {
  return new Date(ts + ENERGY_HK_OFFSET_MS).toISOString().slice(0, 10);
}
function hkEnergyTime(ts) {
  return new Date(ts + ENERGY_HK_OFFSET_MS).toISOString().slice(11, 16);
}
function energyNumber(value) {
  if (value === null || value === undefined || value === '') return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function buildDailyEnergySeries(deviceId, rows, days, now = Date.now()) {
  const today = hkEnergyDateKey(now);
  const todayStart = Date.parse(today + 'T00:00:00+08:00');
  const dayCount = Math.max(1, Math.min(90, Math.floor(Number(days)) || 7));
  const rangeStart = todayStart - (dayCount - 1) * ENERGY_DAY_MS;
  const series = Array.from({ length: dayCount }, (_, index) => {
    const start = rangeStart + index * ENERGY_DAY_MS;
    return {
      date: hkEnergyDateKey(start), start,
      expectedMs: Math.max(0, Math.min(start + ENERGY_DAY_MS, now) - start),
      pvWh: null, loadWh: null, pvCoveredMs: 0, loadCoveredMs: 0, pairedCoveredMs: 0, lastTs: null,
    };
  });
  const samples = new Map();
  const add = (ts, pv, load) => {
    const t = energyNumber(ts);
    if (t === null || t > now || t < rangeStart - DAILY_ENERGY_MAX_GAP_MS) return;
    const point = samples.get(t) || { t, pv: null, load: null };
    const pvW = energyNumber(pv), loadW = energyNumber(load);
    if (pvW !== null && pvW >= 0) point.pv = pvW;
    if (loadW !== null && loadW >= 0) point.load = loadW;
    samples.set(t, point);
  };
  // 相同時間只計一次；缺失欄位不會覆蓋另一來源的有效讀值。
  for (const row of rows) add(row.timestamp_ms, row.pv_power_w, row.load_power_w);
  for (const point of State.history[deviceId] || []) add(point.t, point.pvP, point.loadP);
  const data = State.data[deviceId];
  if (data?.lastReading && data.lastUpdate) {
    add(data.lastUpdate, data.lastReading.pvPower, data.lastReading.loadPower);
  }
  const points = Array.from(samples.values()).sort((a, b) => a.t - b.t);
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    const duration = b.t - a.t;
    if (duration <= 0 || duration > DAILY_ENERGY_MAX_GAP_MS) continue;
    let left = Math.max(a.t, rangeStart);
    const right = Math.min(b.t, now);
    while (left < right) {
      const index = Math.floor((left - rangeStart) / ENERGY_DAY_MS);
      const day = series[index];
      if (!day) break;
      const segmentEnd = Math.min(right, day.start + ENERGY_DAY_MS);
      if (a.pv !== null && b.pv !== null && a.load !== null && b.load !== null) {
        day.pairedCoveredMs += segmentEnd - left;
      }
      for (const [field, energy, coverage] of [
        ['pv', 'pvWh', 'pvCoveredMs'], ['load', 'loadWh', 'loadCoveredMs'],
      ]) {
        if (a[field] === null || b[field] === null) continue;
        const p0 = a[field] + (b[field] - a[field]) * (left - a.t) / duration;
        const p1 = a[field] + (b[field] - a[field]) * (segmentEnd - a.t) / duration;
        day[energy] = (day[energy] ?? 0) + (p0 + p1) / 2 * (segmentEnd - left) / 3600000;
        day[coverage] += segmentEnd - left;
        day.lastTs = segmentEnd;
      }
      left = segmentEnd;
    }
  }
  return series;
}

function dailyEnergyNote(series) {
  const today = series[series.length - 1];
  const recorded = today.pvWh !== null || today.loadWh !== null;
  const progress = recorded
    ? '今天截至 ' + hkEnergyTime(today.lastTs) + '，發電／用電有效記錄 ' +
      fmt(today.pvCoveredMs / 3600000, 1) + '／' + fmt(today.loadCoveredMs / 3600000, 1) + ' 小時。'
    : '今天暫無可計算的功率記錄。';
  return '香港時間 00:00 起計 · 功率積分估算（Wh）。' + progress + '缺失時段不補算。';
}

async function loadDailyEnergyChart(deviceId, days) {
  const canvas = document.getElementById('dvDailyChart');
  const loading = document.getElementById('dvDailyLoading');
  const note = document.getElementById('dvDailyNote');
  if (!canvas || typeof Chart === 'undefined') return;
  const request = ++_dailyChartRequest;
  if (_dailyChart) { _dailyChart.destroy(); _dailyChart = null; }
  if (loading) loading.classList.add('show');
  try {
    const resp = await fetchLog(deviceId, 50000);
    if (request !== _dailyChartRequest || !canvas.isConnected) return;
    if (!resp.success) throw new Error(resp.error || 'CSV fetch failed');
    const series = buildDailyEnergySeries(deviceId, resp.rows || [], days);
    if (note) note.textContent = dailyEnergyNote(series);
    if (loading) loading.classList.remove('show');
    if (!series.some(day => day.pvWh !== null || day.loadWh !== null)) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (loading) {
        loading.textContent = '所選時段暫無可計算的功率記錄；需要至少兩筆相鄰讀值，長時間斷線不補算';
        loading.classList.add('show');
      }
      return;
    }
    const rounded = value => value === null ? null : Math.round(value);
    Chart.defaults.color = '#aab8c7';
    Chart.defaults.borderColor = '#2a3050';
    Chart.defaults.font.family = "'JetBrains Mono', monospace";
    Chart.defaults.font.size = 10;
    _dailyChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: series.map(day => day.date.slice(5)),
        datasets: [
          { label: 'PV 發電量（估算 Wh）', data: series.map(day => rounded(day.pvWh)),
            backgroundColor: 'rgba(245,165,36,0.7)', borderColor: '#f5a524', borderWidth: 1, borderRadius: 2 },
          { label: '負載用電量（估算 Wh）', data: series.map(day => rounded(day.loadWh)),
            backgroundColor: 'rgba(6,182,212,0.6)', borderColor: '#06b6d4', borderWidth: 1, borderRadius: 2 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top', align: 'end', labels: { boxWidth: 12, padding: 12, font: { size: 11 } } },
          tooltip: {
            backgroundColor: '#111524', borderColor: '#3d4670', borderWidth: 1, padding: 10,
            callbacks: {
              title: items => {
                const day = items.length ? series[items[0].dataIndex] : null;
                return day ? day.date + '（香港時間）' : '';
              },
              afterLabel: item => {
                const day = series[item.dataIndex];
                const coverage = item.datasetIndex === 0 ? day.pvCoveredMs : day.loadCoveredMs;
                return '有效記錄 ' + fmt(coverage / 3600000, 2) + ' 小時' +
                  (coverage < day.expectedMs - 60000 ? '（資料未齊）' : '');
              },
              afterBody: items => {
                const day = items.length ? series[items[0].dataIndex] : null;
                if (!day || day.pvWh === null || day.loadWh === null) return '';
                if (day.pairedCoveredMs < Math.max(day.pvCoveredMs, day.loadCoveredMs) - 1) {
                  return ['', '發電／用電資料覆蓋不一致，暫不計算淨能量'];
                }
                const net = Math.round(day.pvWh - day.loadWh);
                return ['', '估算淨能量: ' + (net >= 0 ? '+' : '') + net.toLocaleString('en') + ' Wh'];
              },
            },
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { beginAtZero: true, grid: { color: '#1a2540' },
            title: { display: true, text: '估算能量（Wh）', font: { size: 10 }, color: '#6c7689' } },
        },
      },
    });
  } catch (e) {
    if (request !== _dailyChartRequest || !canvas.isConnected) return;
    if (note) note.textContent = '香港日曆日能量需要歷史功率記錄；目前無法載入。';
    if (loading) {
      loading.textContent = '加載失敗: ' + e.message;
      loading.classList.add('show');
    }
    console.error('loadDailyEnergyChart failed:', e);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[<>&"']/g, c => ({
    '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderTopStats() {
  let online = 0, alarm = 0, offline = 0;
  for (const dev of State.devices) {
    const d = State.data[dev.id];
    if (!dev.enabled || !d || !d.online || !d.lastReading) {
      offline++;
    } else if (alarmLevel(dev, d.lastReading) === 2) {
      alarm++;
    } else {
      online++;
    }
  }
  $('statOnline').textContent = online;
  $('statAlarm').textContent = alarm;
  $('statOffline').textContent = offline;

  // last update
  let mostRecent = 0;
  for (const id of Object.keys(State.data)) {
    const t = State.data[id].lastUpdate;
    if (t && t > mostRecent) mostRecent = t;
  }
  $('statLastUpdate').textContent = mostRecent ?
    new Date(mostRecent).toTimeString().slice(0, 8) : '—';

  // (站点概览标题已移除)
}

async function refreshLogStatus(deviceId) {
  const el = document.getElementById('log-status-' + deviceId);
  if (!el) return;
  try {
    const d = await fetchLog(deviceId, 1);
    if (!d.success) throw new Error(d.error || 'fetch failed');
    const cnt = d.total_rows ?? d.count ?? 0;
    const intervalMin = State.globalSettings.logIntervalMin;
    if (cnt === 0) {
      el.innerHTML = `<span style="color:var(--text-3)">尚無記錄 · 每 ${intervalMin} 分鐘自動採樣一次</span>`;
    } else {
      const last = d.rows[d.rows.length - 1];
      const lastTs = last?.iso_time ? last.iso_time.replace('T', ' ') :
        (last?.timestamp_ms ? new Date(last.timestamp_ms).toLocaleString() : '?');
      el.innerHTML = `共 <b style="color:var(--text-0)">${cnt}</b> 條 · 最近 <span style="color:var(--text-1)">${escapeHtml(lastTs)}</span> · 每 ${intervalMin} 分鐘採樣`;
    }
  } catch (e) {
    el.innerHTML = `<span style="color:var(--danger)">無法讀取日誌: ${escapeHtml(e.message)}</span>`;
  }
}
