async function saveLogPoint(dev, reading) {
  if (!reading) return;
  const payload = {
    deviceId: dev.id,
    deviceName: dev.name,
    data: {
      pvVoltage: reading.pvVoltage,
      pvCurrent: reading.pvCurrent,
      pvPower: reading.pvPower,
      batVoltage: reading.batVoltage,
      batCurrent: reading.batCurrent,
      batPower: reading.batPower,
      batSoc: reading.batSoc,
      batLevel: reading.batLevel,
      loadVoltage: reading.loadVoltage,
      loadCurrent: reading.loadCurrent,
      loadPower: reading.loadPower,
      envTemp: reading.envTemp,
      devTemp: reading.devTemp,
      todayChgKwh: reading.todayChgKwh,
      totalChgKwh: reading.totalChgKwh,
      todayLoadKwh: reading.todayLoadKwh,
      totalLoadKwh: reading.totalLoadKwh,
      runDays: reading.runDays,
      batStatus: reading.batStatus,
      chgStatus: reading.chgStatus,
      dischgStatus: reading.dischgStatus,
      stage: reading.stage,
      faults: reading.faults || [],
    },
  };
  const r = await fetch('/api/log_save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  if (d.success) {
    State.lastLogSave[dev.id] = Date.now();
  }
  return d;
}

async function fetchLog(deviceId, limit = 5000, since = null) {
  const sinceQuery = since === null ? '' : '&since=' + encodeURIComponent(since);
  const r = await fetch(`/api/log_get?deviceId=${encodeURIComponent(deviceId)}&limit=${limit}${sinceQuery}`);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function fetchLogList() {
  const r = await fetch('/api/log_list');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ---------- History chart ----------
// ---------- History data sources ----------
const RANGE_DEFS = {
  '15m':     { ms: 15 * 60 * 1000,            source: 'ram', label: '近 15 分' },
  '1h':      { ms: 60 * 60 * 1000,            source: 'ram', label: '近 1 小時' },
  '6h':      { ms: 6 * 60 * 60 * 1000,        source: 'ram', label: '近 6 小時' },
  'ram-all': { ms: null,                       source: 'ram', label: '全部即時' },
  '24h':     { ms: 24 * 60 * 60 * 1000,       source: 'csv', label: '近 24 小時' },
  '7d':      { ms: 7 * 24 * 60 * 60 * 1000,   source: 'csv', label: '近 7 天' },
  '30d':     { ms: 30 * 24 * 60 * 60 * 1000,  source: 'csv', label: '近 30 天' },
  'csv-all': { ms: null,                       source: 'csv', label: '全部 CSV' },
};

// 把 CSV 行格式映射回内存格式 ({ t, pvP, loadP, batV, batSoc, envT })
function csvRowToPoint(row) {
  return {
    t:     parseInt(row.timestamp_ms),
    pvP:   row.pv_power_w !== '' && row.pv_power_w !== null ? Number(row.pv_power_w) : null,
    loadP: row.load_power_w !== '' && row.load_power_w !== null ? Number(row.load_power_w) : null,
    batV:  row.bat_voltage !== '' && row.bat_voltage !== null ? Number(row.bat_voltage) : null,
    batSoc: row.bat_soc_pct !== '' && row.bat_soc_pct !== null ? Number(row.bat_soc_pct) : null,
    envT:  row.env_temp_c !== '' && row.env_temp_c !== null ? Number(row.env_temp_c) : null,
    todayChg:  row.today_chg_kwh !== '' ? Number(row.today_chg_kwh) : null,
    todayLoad: row.today_load_kwh !== '' ? Number(row.today_load_kwh) : null,
    faults:    row.faults || '',
  };
}

// 下采样: 数据点超过 N 个时,均匀抽取
function downsample(arr, maxPoints) {
  if (!arr || arr.length <= maxPoints) return arr;
  const step = arr.length / maxPoints;
  const out = [];
  for (let i = 0; i < maxPoints; i++) out.push(arr[Math.floor(i * step)]);
  if (arr.length > 0) out.push(arr[arr.length - 1]);
  return out;
}

async function getHistorySlice(deviceId, rangeKey) {
  const range = rangeKey || State.globalSettings.historyRange;
  const def = RANGE_DEFS[range] || RANGE_DEFS['1h'];

  if (def.source === 'ram') {
    const all = State.history[deviceId] || [];
    if (def.ms === null) return { data: downsample(all, 600), source: 'ram', range };
    const cutoff = Date.now() - def.ms;
    return { data: downsample(all.filter(p => p.t >= cutoff), 600), source: 'ram', range };
  }

  // CSV 源
  try {
    const r = await fetch(`/api/log_get?deviceId=${encodeURIComponent(deviceId)}&limit=50000`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const resp = await r.json();
    if (!resp.success) throw new Error(resp.error || 'CSV fetch failed');
    let rows = (resp.rows || []).map(csvRowToPoint).filter(p => !isNaN(p.t));
    if (def.ms !== null) {
      const cutoff = Date.now() - def.ms;
      rows = rows.filter(p => p.t >= cutoff);
    }
    rows = downsample(rows, 600);
    return { data: rows, source: 'csv', range };
  } catch (e) {
    console.warn('CSV fetch failed:', e);
    return { data: [], source: 'csv', range, error: e.message };
  }
}

function updateDrawerChartHeader(slice) {

const SETTINGS_SECTIONS = ['sizing', 'devices', 'brand', 'general', 'email'];
const SettingsUI = { mounted: false, section: 'sizing', focusDeviceId: null, returnHash: '', emailLoaded: false, formDirty: false };
const SIZING_ASSUMPTIONS = Object.freeze({
  peakSunHours: 4, loadMargin: 1.2, pvEfficiency: 0.7, usableBatteryRatio: 0.95, outputEfficiency: 0.95
});
const BATTERY_CAPACITIES = Object.freeze([60, 120, 200, 400]);
const SIZING_DEFAULTS = Object.freeze({ powerW: '50', hoursPerDay: '24', backupDays: '5', voltageV: '12.8', batteryCapacityAh: '400' });
const SIZING_STORAGE_KEY = 'ty_solar_sizing_v1';
let sizingInputs = null;

function selectStandardBattery(requiredAh) {
  if (!Number.isFinite(requiredAh) || requiredAh < 0) return null;
  if (requiredAh === 0) return 0;
  return BATTERY_CAPACITIES.find(capacity => capacity >= requiredAh) ?? null;
}
function calculateSolarSizing(input) {
  const labels = { powerW: '設備總功率', hoursPerDay: '每日運行時間', backupDays: '無發電備用天數', voltageV: '電池標稱電壓' };
  const values = {};
  for (const key of Object.keys(labels)) {
    const raw = input?.[key];
    if (raw === null || raw === undefined || (typeof raw !== 'string' && typeof raw !== 'number') || String(raw).trim() === '') {
      return { ok: false, field: key, message: '請填寫' + labels[key] + '。' };
    }
    values[key] = Number(raw);
    if (!Number.isFinite(values[key]) || values[key] < 0 || (key === 'voltageV' && values[key] === 0) || (key === 'hoursPerDay' && values[key] > 24)) {
      return { ok: false, field: key, message: key === 'hoursPerDay' ? '每日運行時間須介乎 0 至 24 小時。' : labels[key] + (key === 'voltageV' ? '須大於 0。' : '須為有效的非負數。') };
    }
  }
  const rawCapacity = input && Object.prototype.hasOwnProperty.call(input, 'batteryCapacityAh') ? input.batteryCapacityAh : SIZING_DEFAULTS.batteryCapacityAh;
  const selectedAh = Number(rawCapacity);
  if ((typeof rawCapacity !== 'string' && typeof rawCapacity !== 'number') || !BATTERY_CAPACITIES.includes(selectedAh)) {
    return { ok: false, field: 'batteryCapacityAh', message: '請選擇 60、120、200 或 400 Ah 的單顆電池規格。' };
  }
  const a = SIZING_ASSUMPTIONS;
  const dailyWh = values.powerW * values.hoursPerDay;
  const designWh = dailyWh * a.loadMargin;
  const pvWp = Math.ceil(designWh / (a.peakSunHours * a.pvEfficiency));
  const batteryAh = Math.ceil(designWh * values.backupDays / (values.voltageV * a.usableBatteryRatio * a.outputEfficiency));
  if (![dailyWh, designWh, pvWp, batteryAh].every(Number.isFinite)) return { ok: false, message: '數值過大，請檢查輸入。' };
  const backupDaysAvailable = designWh > 0 ? selectedAh * values.voltageV * a.usableBatteryRatio * a.outputEfficiency / designWh : null;
  if (backupDaysAvailable !== null && !Number.isFinite(backupDaysAvailable)) return { ok: false, message: '數值過大，請檢查輸入。' };
  return { ok: true, dailyWh, designWh, pvWp, batteryAh, selectedAh, backupDaysAvailable, batterySufficient: batteryAh <= selectedAh, standardAh: selectStandardBattery(batteryAh), ...values };
}
function loadSizingInputs() {
  if (sizingInputs) return sizingInputs;
  sizingInputs = { ...SIZING_DEFAULTS };

    const saved = JSON.parse(localStorage.getItem(SIZING_STORAGE_KEY) || 'null');
    if (saved && typeof saved === 'object') for (const key of Object.keys(SIZING_DEFAULTS)) {
      if (key === 'batteryCapacityAh' && !BATTERY_CAPACITIES.includes(Number(saved[key]))) continue;
      if (typeof saved[key] === 'string' || typeof saved[key] === 'number') sizingInputs[key] = String(saved[key]);
    }
  } catch (_) { /* The calculator remains usable if local storage is unavailable. */ }
  return sizingInputs;
}

}
function formatSizingAutonomy(days) {
  if (days === null) return '無用電需求';
  if (!Number.isFinite(days) || days < 0) return '—';

  if (days >= 1) return number(Math.floor(days * 10) / 10) + ' 天';
  const hours = days * 24;
  if (hours > 0 && hours < 0.1) return '少於 0.1 小時';
  return number(Math.floor(hours * 10) / 10) + ' 小時';
}

}

// ============================================================
//  History Modal — multi-device long-term comparison
// ============================================================
const HistoryModal = {
  metric: 'batV',         // 当前选中的指标
  range: '24h',           // 当前时间范围
  enabledDevices: null,   // Set<deviceId> | null (null = all)
  chart: null,
  cache: {},              // { deviceId+range: [points] }  缓存避免重复 fetch
  cacheTime: 60 * 1000,   // 缓存 60 秒
};

const METRIC_DEFS = {
  batV:   { label: '電池電壓', unit: 'V', field: 'batV',   yAxisTitle: '電壓 (V)' },
  batSoc: { label: 'SOC',     unit: '%', field: 'batSoc', yAxisTitle: 'SOC (%)' },
  pvP:    { label: 'PV 功率',  unit: 'W', field: 'pvP',    yAxisTitle: '功率 (W)' },
  loadP:  { label: '負載功率', unit: 'W', field: 'loadP',  yAxisTitle: '功率 (W)' },
  envT:   { label: '環境溫度', unit: '°C', field: 'envT',  yAxisTitle: '溫度 (°C)' },
};

// 设备颜色 — 用色相轮均匀分布
function deviceColor(idx, total) {
  const hue = (idx * (360 / Math.max(total, 1)) + 30) % 360;
  return `hsl(${Math.round(hue)} 70% 60%)`;
}

function openHistoryModal() {
  if (State.devices.length === 0) {
    toast('請先在設置中新增設備', 'warn');
    return;
  }
  // 默认全选设备
  if (!HistoryModal.enabledDevices) {
    HistoryModal.enabledDevices = new Set(State.devices.map(d => d.id));
  }
  $('historyModal').classList.add('show');
  document.body.classList.add('modal-open');
  renderHistoryControls();
  loadAndRenderHistoryChart();
}

function closeHistoryModal() {
  $('historyModal').classList.remove('show');
  document.body.classList.remove('modal-open');
  if (HistoryModal.chart) {
    HistoryModal.chart.destroy();
    HistoryModal.chart = null;
  }
}

function renderHistoryControls() {
  // 同步指标 / 范围按钮的 active 状态
  document.querySelectorAll('#histMetricTabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.metric === HistoryModal.metric);
  });
  document.querySelectorAll('#histRangeTabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.range === HistoryModal.range);
  });

  // 设备开关标签
  const tagsEl = $('histDeviceTags');
  const total = State.devices.length;
  tagsEl.innerHTML = State.devices.map((dev, i) => {
    const color = deviceColor(i, total);
    const on = HistoryModal.enabledDevices.has(dev.id);
    return `<div class="hist-device-tag ${on ? 'on' : 'off'}"
                  data-id="${dev.id}"
                  style="${on ? `color:${color};` : ''}">
              <span class="swatch" style="${on ? `background:${color}` : ''}"></span>
              <span>${escapeHtml(dev.name)}</span>
            </div>`;
  }).join('');

  // Wire device toggle
  tagsEl.querySelectorAll('.hist-device-tag').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      if (HistoryModal.enabledDevices.has(id)) {
        HistoryModal.enabledDevices.delete(id);
      } else {
        HistoryModal.enabledDevices.add(id);
      }
      renderHistoryControls();
      loadAndRenderHistoryChart();
    });
  });
}

async function loadAndRenderHistoryChart() {
  const loading = $('histChartLoading');
  loading.classList.add('show');

  const enabledIds = Array.from(HistoryModal.enabledDevices);
  const range = HistoryModal.range;
  const metric = HistoryModal.metric;
  const def = METRIC_DEFS[metric];

  // 并发拉数据(每个设备一次)
  const results = await Promise.all(enabledIds.map(async id => {
    const cacheKey = `${id}::${range}`;
    const cached = HistoryModal.cache[cacheKey];
    if (cached && Date.now() - cached.t < HistoryModal.cacheTime) {
      return { id, data: cached.data };
    }
    const slice = await getHistorySlice(id, range);
    HistoryModal.cache[cacheKey] = { t: Date.now(), data: slice.data };
    return { id, data: slice.data };
  }));

  // 构造 Chart datasets
  const total = State.devices.length;
  const datasets = results.map(r => {
    const dev = State.devices.find(d => d.id === r.id);
    if (!dev) return null;
    const idxInAll = State.devices.indexOf(dev);
    const color = deviceColor(idxInAll, total);
    // 把 [{t, batV, ...}] 转成 [{x: t, y: value}]
    const pts = (r.data || [])
      .map(p => ({ x: p.t, y: p[def.field] }))
      .filter(p => p.y !== null && p.y !== undefined && !isNaN(p.y));
    return {
      label: dev.name,
      deviceId: dev.id,
      data: pts,
      borderColor: color,
      backgroundColor: color.replace('60%)', '60% / 0.10)'),
      tension: 0.25,
      pointRadius: 0,
      borderWidth: 2,
      fill: false,
    };
  }).filter(Boolean);

  // 渲染图表
  const canvas = $('histCompareChart');
  if (HistoryModal.chart) {
    HistoryModal.chart.destroy();
    HistoryModal.chart = null;
  }
  if (typeof Chart === 'undefined') {
    loading.textContent = '圖表庫未載入';
    return;
  }

  HistoryModal.chart = new Chart(canvas, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      parsing: false,            // data 已是 {x, y} 格式
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      plugins: {
        legend: {
          position: 'top', align: 'end',
          labels: { boxWidth: 12, padding: 12, font: { size: 11 } },
        },
        tooltip: {
          backgroundColor: '#111524',
          borderColor: '#3d4670',
          borderWidth: 1,
          padding: 10,
          callbacks: {
            title: (items) => {
              if (!items.length) return '';
              const ts = items[0].parsed.x;
              return new Date(ts).toLocaleString();
            },
            label: (ctx) => {
              const v = ctx.parsed.y;
              return `${ctx.dataset.label}: ${v == null ? '—' : v.toFixed(2)} ${def.unit}`;
            },
          },
        },
      },
      scales: {
        x: {
          type: 'linear',
          grid: { color: '#1a2540' },
          ticks: {
            maxTicksLimit: 8,
            callback: function(v) {
              const range = HistoryModal.range;
              if (['7d', '30d', 'csv-all'].includes(range)) {
                return new Date(v).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
              }
              return new Date(v).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
            },
          },
        },
        y: {
          beginAtZero: ['pvP', 'loadP', 'batSoc'].includes(metric),
          grid: { color: '#1a2540' },
          title: { display: true, text: def.yAxisTitle, color: '#aab8c7', font: { size: 11 } },
        },
      },
    },
  });

  // 渲染统计摘要
  renderHistoryStats(results, def);
  loading.classList.remove('show');
}

function renderHistoryStats(results, def) {
  const total = State.devices.length;
  const html = results.map(r => {
    const dev = State.devices.find(d => d.id === r.id);
    if (!dev) return '';
    const idxInAll = State.devices.indexOf(dev);
    const color = deviceColor(idxInAll, total);
    const values = (r.data || []).map(p => p[def.field]).filter(v => v !== null && v !== undefined && !isNaN(v));
    if (values.length === 0) {
      return `<div class="hist-stat-row">
        <span class="swatch" style="background:${color}"></span>
        <span class="name">${escapeHtml(dev.name)}</span>
        <span class="stats" style="color:var(--text-3)">無數據</span>
      </div>`;
    }
    const avg = values.reduce((a,b) => a+b, 0) / values.length;
    const min = Math.min(...values);
    const max = Math.max(...values);
    return `<div class="hist-stat-row">
      <span class="swatch" style="background:${color}"></span>
      <span class="name">${escapeHtml(dev.name)}</span>
      <span class="stats">avg ${avg.toFixed(2)} · min ${min.toFixed(2)} · max ${max.toFixed(2)} · n=${values.length}</span>
    </div>`;
  }).join('');
  $('histStats').innerHTML = html ||
    '<div style="color:var(--text-3);font-size:12px;text-align:center;padding:12px">未選擇設備</div>';
}

let _emailRecipientRows = [];
let _emailRecipientSaveQueue = Promise.resolve();
let _emailRecipientSaveRevision = 0;
let _emailConfigRenderId = 0;

function normaliseEmailRecipients(recipients) {
  if (!Array.isArray(recipients)) throw new Error('收件人列表格式不正確');
  const seen = new Set();
  return recipients.map(item => {
    const source = typeof item === 'string' ? { email: item } : item;
    if (!source || typeof source.email !== 'string') throw new Error('每位收件人須有電郵地址');
    const email = source.email.trim();
    if (!validRecipientEmail(email)) throw new Error('電郵地址格式不正確：' + email);
    const key = email.toLowerCase();
    if (seen.has(key)) throw new Error('收件人電郵重複：' + email);
    seen.add(key);
    const result = { email };
    for (const field of ['enabled', 'alerts', 'reports']) {
      if (source[field] !== undefined && typeof source[field] !== 'boolean') throw new Error('收件人開關格式不正確');
      result[field] = source[field] ?? true;
    }
    return result;
  });
}

function validRecipientEmail(email) {
  return email.length <= 254 && /^[A-Za-z0-9.!#$%&'*+/=?^_{}|~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+$/.test(email);
}

function renderEmailRecipientRows() {
  const list = document.getElementById('email-recipient-list');
  if (!list) return;
  list.innerHTML = _emailRecipientRows.length ? _emailRecipientRows.map((row, index) => `
    <div class="email-recipient-row${row.enabled ? '' : ' is-disabled'}" data-recipient-index="${index}">
      <label class="email-recipient-switch" title="${row.enabled ? '停用' : '啟用'}此收件人">
        <input type="checkbox" role="switch" data-recipient-field="enabled" aria-label="${escapeHtml(row.email)} 啟用收件人" ${row.enabled ? 'checked' : ''}>
        <span class="email-recipient-switch-track" aria-hidden="true"></span>
      </label>
      <span class="email-recipient-address" title="${escapeHtml(row.email)}">${escapeHtml(row.email)}</span>
      <label class="email-recipient-option email-recipient-alert">
        <input type="checkbox" data-recipient-field="alerts" aria-label="${escapeHtml(row.email)} 接收警報" ${row.alerts ? 'checked' : ''}><span>警報</span>
      </label>
      <label class="email-recipient-option email-recipient-report">
        <input type="checkbox" data-recipient-field="reports" aria-label="${escapeHtml(row.email)} 接收報表" ${row.reports ? 'checked' : ''}><span>報表</span>
      </label>
      <button type="button" class="email-recipient-remove" data-recipient-remove aria-label="移除 ${escapeHtml(row.email)}">移除</button>
    </div>`).join('') : '<div class="email-recipient-empty">尚未加入收件人，請在下方輸入電郵地址。</div>';
}

function queueEmailRecipientsSave() {
  const revision = ++_emailRecipientSaveRevision;
  const body = JSON.stringify({ recipients: _emailRecipientRows.map(row => ({ ...row })) });
  const setStatus = (text, failed = false) => {
    if (revision !== _emailRecipientSaveRevision) return;
    const status = document.getElementById('email-recipient-status');
    if (status) { status.textContent = text; status.classList.toggle('is-error', failed); }
  };
  setStatus('正在儲存收件人設定…');
  _emailRecipientSaveQueue = _emailRecipientSaveQueue.then(async () => {
    try {
      const response = await fetch('/api/email_recipients', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.error || '儲存失敗');
      setStatus('收件人設定已儲存');
      return true;
    } catch (error) {
      setStatus('收件人設定未儲存：' + error.message + '；請重新操作或按「儲存」。', true);
      if (revision === _emailRecipientSaveRevision) toast('收件人設定儲存失敗', 'err');
      return false;
    }
  });
  return _emailRecipientSaveQueue;
}

function addEmailRecipient() {
  const input = document.getElementById('email-recipient-new');
  const email = input.value.trim();
  input.setCustomValidity('');
  if (!validRecipientEmail(email)) { input.setCustomValidity('請輸入有效的電郵地址'); input.reportValidity(); return false; }
  if (_emailRecipientRows.some(row => row.email.toLowerCase() === email.toLowerCase())) {
    input.setCustomValidity('此電郵地址已在列表中'); input.reportValidity(); return false;
  }
  _emailRecipientRows.push({ email, enabled: true, alerts: true, reports: true });
  input.value = '';
  renderEmailRecipientRows();
  queueEmailRecipientsSave();
  input.focus();
  return true;
}

function wireEmailRecipientEditor() {
  renderEmailRecipientRows();
  const list = document.getElementById('email-recipient-list');
  list.addEventListener('change', event => {
    const input = event.target.closest('input[data-recipient-field]');
    const row = input?.closest('.email-recipient-row');
    if (!row) return;
    const entry = _emailRecipientRows[Number(row.dataset.recipientIndex)];
    const field = input.dataset.recipientField;
    if (!entry || !['enabled', 'alerts', 'reports'].includes(field)) return;
    entry[field] = input.checked;
    row.classList.toggle('is-disabled', !entry.enabled);
    row.querySelector('.email-recipient-switch').title = (entry.enabled ? '停用' : '啟用') + '此收件人';
    queueEmailRecipientsSave();
  });
  list.addEventListener('click', event => {
    const button = event.target.closest('button[data-recipient-remove]');
    if (!button) return;
    const index = Number(button.closest('.email-recipient-row').dataset.recipientIndex);
    if (!Number.isInteger(index) || !_emailRecipientRows[index]) return;
    _emailRecipientRows.splice(index, 1);
    renderEmailRecipientRows();
    queueEmailRecipientsSave();
    document.getElementById('email-recipient-new').focus();
  });
  document.getElementById('email-recipient-add').addEventListener('click', addEmailRecipient);
  const input = document.getElementById('email-recipient-new');
  input.addEventListener('input', () => input.setCustomValidity(''));
  input.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); addEmailRecipient(); } });
}

<section class="email-recipient-editor" aria-labelledby="email-recipient-title">
  <h3 id="email-recipient-title">警報收件人</h3>
  <p class="email-recipient-help">每位收件人可獨立選擇「警報」及「報表」。停用後不會收到郵件，原有選項會保留。列表改動會自動儲存；郵件總開關及各功能開關仍須啟用。</p>
  <div id="email-recipient-list"></div>
  <div class="email-recipient-footer">
    <input type="email" id="email-recipient-new" placeholder="name@example.com" aria-label="新增收件人電郵地址" maxlength="254" autocomplete="off" spellcheck="false">
    <button type="button" id="email-recipient-add">加入</button>
    <button type="button" id="email-test-btn">寄測試郵件</button>
  </div>
  <div class="email-recipient-feedback"><span id="email-recipient-status" role="status" aria-live="polite"></span><span id="email-test-hint" role="status" aria-live="polite">測試郵件會使用目前表單設定，寄給已啟用且有勾選警報或報表的收件人。</span></div>
</section>

      <div class="field" style="margin-bottom:10px">
        <label>公司名 / 系統名稱 (郵件標題同底部落款)</label>
        <input type="text" id="email-company-name" value="${escapeHtml(cfg.company_name || 'TY 太陽能監控系統')}" placeholder="藍鋼保安顧問有限公司" style="width:100%">
        <span class="hint">例如: 藍鋼保安顧問有限公司, 顯示喺郵件標題同底部 "此郵件由 XXX 自動發送"</span>
      </div>

      <div style="padding:10px;background:var(--bg-3);border-left:2px solid var(--text-3);font-size:11px;color:var(--text-2);line-height:1.6;margin-bottom:16px">
        <strong>兩個郵件功能係獨立嘅:</strong> 你可以只開「每日健康檢查」而關閉「即時電壓告警」,咁就唔會有中途嘅告警郵件,淨係得每日總結。<br>
        <strong>Gmail 設置指引:</strong> Google 帳戶 → 安全性 → 兩步驟驗證 → 應用專用密碼 → 生成後填喺上面「SMTP 密碼」欄。<br>
        <strong>QQ 郵箱:</strong> 郵箱設置 → 帳戶 → POP3/SMTP → 開啟服務 → 生成授權碼填喺「SMTP 密碼」欄。
      </div>

      <div style="padding:14px;background:var(--bg-3);border-left:3px solid var(--solar);border-radius:2px">
        <div style="font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:1px;color:var(--solar);margin-bottom:12px">📅 每日健康檢查</div>
        <div class="field-grid two" style="margin-bottom:12px">
          <div class="field">
            <label>
              <input type="checkbox" id="daily-report-enabled" ${cfg.daily_report_enabled ? 'checked' : ''}>
              啟用每日檢查
            </label>
            <span class="hint">每日自動掃描所有站點, 有問題先發郵件</span>
          </div>
          <div class="field">
            <label>
              <input type="checkbox" id="daily-report-send-ok" ${cfg.daily_report_send_ok ? 'checked' : ''}>
              無異常都發郵件 (「一切正常」報告)
            </label>
            <span class="hint">默認關閉, 冇異常就唔發, 避免郵件疲勞</span>
          </div>
        </div>

        <div class="field" style="margin-bottom:12px">
          <label>發送時間 (每日可多次, 用 VPS 系統時區)</label>
          <div id="daily-times-list" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">
            ${(cfg.daily_report_times && cfg.daily_report_times.length ? cfg.daily_report_times : ['09:00']).map((t, i) => `
              <div class="daily-time-row" data-time-idx="${i}" style="display:inline-flex;align-items:center;gap:4px;background:var(--bg-2);padding:4px 4px 4px 10px;border:1px solid var(--line)">
                <input type="time" value="${escapeHtml(t)}" class="daily-time-input" style="width:110px;background:transparent;border:none;color:var(--text-0);font-family:var(--mono)">
                <button type="button" class="daily-time-remove" style="width:24px;height:24px;background:transparent;border:none;color:var(--text-3);cursor:pointer;font-size:14px">✕</button>
              </div>
            `).join('')}
          </div>
          <button type="button" id="daily-time-add" class="dv-mini-btn" style="margin-top:8px;padding:6px 12px">+ 新增發送時間</button>
          <span class="hint" style="display:block;margin-top:6px">例如: 09:00 (朝早報告) + 18:00 (放工前報告)</span>
        </div>

        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px">
          <button type="button" id="daily-report-test-btn" class="dv-mini-btn" style="padding:8px 16px">🔍 立即檢查測試</button>
          <span class="hint" id="daily-report-test-hint">即時執行一次檢查(唔會等時間)</span>
        </div>

        <div style="margin-top:10px;font-size:11px;color:var(--text-3);line-height:1.6">
          <strong>檢查項目:</strong> ① 站點離線 (超過 30 分鐘無數據) ② 電池電壓低於閾值 ③ 昨日發電偏低 (少於近 7 日平均嘅 40%)
        </div>
      </div>
    `;

    wireEmailRecipientEditor();

    // 測試按鈕
    document.getElementById('email-test-btn').addEventListener('click', async () => {
      const btn = document.getElementById('email-test-btn');
      const hint = document.getElementById('email-test-hint');
      btn.disabled = true;
      btn.textContent = '發送中...';
      hint.textContent = '';
      const cfg = collectEmailConfigFromForm();
      try {
        if (!cfg.recipients.some(row => row.enabled && (row.alerts || row.reports))) throw new Error('請先啟用至少一位收件人並勾選警報或報表');
        const r = await fetch('/api/email_test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ config: cfg }),
        });
        const d = await r.json();
        if (d.success) {
          hint.innerHTML = '<span style="color:var(--battery)">✓ 已發送, 請查收</span>';
        } else {
          hint.innerHTML = `<span style="color:var(--danger)">✗ ${escapeHtml(d.error || '失敗')}</span>`;
        }
      } catch (e) {
        hint.innerHTML = `<span style="color:var(--danger)">✗ ${escapeHtml(e.message)}</span>`;
      }
      btn.disabled = false;
      btn.textContent = '寄測試郵件';
    });

    // 每日報告立即測試按鈕
    document.getElementById('daily-report-test-btn').addEventListener('click', async () => {
      const btn = document.getElementById('daily-report-test-btn');
      const hint = document.getElementById('daily-report-test-hint');
      btn.disabled = true;
      btn.textContent = '檢查中...';
      hint.textContent = '';
      // 先保存配置(等 daily_report_test 可以拎到最新設定)
      const saved = await saveEmailConfig();
      if (!saved) {
        hint.innerHTML = '<span style="color:var(--danger)">✗ 保存配置失敗</span>';
        btn.disabled = false;
        btn.textContent = '🔍 立即檢查測試';
        return;
      }
      try {
        const r = await fetch('/api/daily_report_test', { method: 'POST' });
        const d = await r.json();
        if (d.success) {
          hint.innerHTML = '<span style="color:var(--battery)">✓ 已執行, 有問題會發郵件, 冇問題會發總覽</span>';
        } else {
          hint.innerHTML = `<span style="color:var(--danger)">✗ ${escapeHtml(d.error || '失敗')}</span>`;
        }
      } catch (e) {
        hint.innerHTML = `<span style="color:var(--danger)">✗ ${escapeHtml(e.message)}</span>`;
      }
      btn.disabled = false;
      btn.textContent = '🔍 立即檢查測試';
    });

    // 新增發送時間按鈕
    document.getElementById('daily-time-add').addEventListener('click', () => {
      const list = document.getElementById('daily-times-list');
      const idx = list.children.length;
      const wrap = document.createElement('div');
      wrap.className = 'daily-time-row';
      wrap.dataset.timeIdx = idx;
      wrap.style.cssText = 'display:inline-flex;align-items:center;gap:4px;background:var(--bg-2);padding:4px 4px 4px 10px;border:1px solid var(--line)';
      wrap.innerHTML = `
        <input type="time" value="12:00" class="daily-time-input" style="width:110px;background:transparent;border:none;color:var(--text-0);font-family:var(--mono)">
        <button type="button" class="daily-time-remove" style="width:24px;height:24px;background:transparent;border:none;color:var(--text-3);cursor:pointer;font-size:14px">✕</button>
      `;
      list.appendChild(wrap);
      wrap.querySelector('.daily-time-remove').addEventListener('click', () => wrap.remove());
    });
    // 已有時間嘅刪除按鈕
    document.querySelectorAll('.daily-time-remove').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('.daily-time-row').remove());
    });
  } catch (e) {
    mount.innerHTML = `<div style="color:var(--danger);padding:12px">加載失敗: ${escapeHtml(e.message)}</div>`;
  }
}

function collectEmailConfigFromForm() {
  const recipients = normaliseEmailRecipients(_emailRecipientRows);
  return {
    enabled: document.getElementById('email-enabled').checked,
    alert_email_enabled: document.getElementById('alert-email-enabled')?.checked ?? true,
    smtp_host: document.getElementById('email-smtp-host').value.trim(),
    smtp_port: parseInt(document.getElementById('email-smtp-port').value) || 587,
    smtp_user: document.getElementById('email-smtp-user').value.trim(),
    smtp_pass: document.getElementById('email-smtp-pass').value,
    from_email: document.getElementById('email-from').value.trim(),
    from_name: document.getElementById('email-from-name').value.trim() || 'TY 太陽能監控',
    company_name: document.getElementById('email-company-name')?.value.trim() || 'TY 太陽能監控系統',
    recipients: recipients,
    cooldown_minutes: parseInt(document.getElementById('email-cooldown').value) || 60,
    use_tls: parseInt(document.getElementById('email-smtp-port').value) !== 465,
    daily_report_enabled: document.getElementById('daily-report-enabled')?.checked || false,
    daily_report_times: Array.from(document.querySelectorAll('.daily-time-input'))
      .map(input => input.value.trim())
      .filter(v => v && /^\d{1,2}:\d{2}$/.test(v)),
    daily_report_send_ok: document.getElementById('daily-report-send-ok')?.checked || false,
  };
}

function saveEmailConfig() {
  let cfg;
  try { cfg = collectEmailConfigFromForm(); } catch (error) { console.error('郵件設定格式不正確:', error); return Promise.resolve(false); }
  const revision = _emailRecipientSaveRevision;
  _emailRecipientSaveQueue = _emailRecipientSaveQueue.then(async () => {
    try {
      const response = await fetch('/api/email_config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ config: cfg }) });
      const result = await response.json();
      const ok = response.ok && result.success;
      if (ok && revision === _emailRecipientSaveRevision) {
        const status = document.getElementById('email-recipient-status');
        if (status) { status.textContent = '收件人設定已儲存'; status.classList.remove('is-error'); }
      }
      return !!ok;
    } catch (error) { console.error('保存郵件配置失敗:', error); return false; }
  });
  return _emailRecipientSaveQueue;
}

function addNewDevice() {
  const newDev = {
    id: uid(),
    name: '新站點 ' + (State.devices.length + 1),
    host: '',
    port: 1030,
    slaveId: 1,
    enabled: true,
    batVMin: 9.3,
    batVMax: 12.6,
    batVAlarmLow: 11.0,
    // === 新增字段:智能预测用 ===
    batCapacityAh: 100,        // 電池額定容量
    batType: 'lifepo4',        // lifepo4 | lead-acid | other
    batUsableRatio: 0.9,       // 可用容量比例 (锂电 0.9, 铅酸 0.5)
    lat: null,                 // 緯度,用於天氣 API
    lon: null,                 // 經度
  };
  State.devices.push(newDev);
  renderSettingsBody(newDev.id);
}

function applySettings() {
  const pi = parseInt($('cfg-pollInterval').value);
  const to = parseInt($('cfg-timeout').value);
  const li = parseInt($('cfg-logIntervalMin').value);
  if (pi >= 1000) State.globalSettings.pollInterval = pi;
  if (to >= 500) State.globalSettings.timeout = to;
  if (li >= 1) State.globalSettings.logIntervalMin = li;

  // 檢查重名 (唔阻止, 提示用戶)
  const nameCount = {};
  for (const d of State.devices) {
    const n = (d.name || '').trim();
    if (n) nameCount[n] = (nameCount[n] || 0) + 1;
  }
  const dupes = Object.keys(nameCount).filter(n => nameCount[n] > 1);
  if (dupes.length > 0) {
    toast(`⚠ 發現重複站點名: ${dupes.join(', ')} — 郵件會加 IP 尾綴區分`, 'warn');
  }

  // 品牌设置
  const bn = $('cfg-brandName');
  const bs = $('cfg-brandSub');
  const bm = $('cfg-brandMark');
  if (bn) State.globalSettings.brandName = bn.value.trim() || 'SOLAR · MULTI';
  if (bs) State.globalSettings.brandSub  = bs.value.trim();
  if (bm) State.globalSettings.brandMark = bm.value.trim().toUpperCase().slice(0, 3) || 'TY';
  // brandLogo 在 file input change 事件里已经写入了

  saveToStorage();
  renderBrand();

  // 保存郵件配置 (異步, 靜默失敗)
  if (document.getElementById('email-enabled')) {
    saveEmailConfig().then(ok => {
      if (!ok) toast('郵件配置保存失敗', 'err');
    });
  }

  closeSettings();
  // Restart polling with new settings & new device list
  stopAllPolling();
  renderAllCards();
  for (const id of Object.keys(State.data)) {
    if (!State.devices.find(d => d.id === id)) delete State.data[id];
  }
  startAllPolling();
  renderTopStats();
  toast('已儲存配置', 'info');
}

// ---------- Wire UI ----------
$('btnSettings').addEventListener('click', () => openSettings());
$('btnAddDevice').addEventListener('click', addNewDevice);
$('btnSaveSettings').addEventListener('click', applySettings);
$('btnCloseSettings').addEventListener('click', closeSettings);
$('btnSaveEmailSettings').addEventListener('click', async () => {
  const button = $('btnSaveEmailSettings');
  button.disabled = true;
  try {
    const ok = await saveEmailConfig();
    toast(ok ? '郵件設定已儲存' : '郵件設定儲存失敗，請重試', ok ? 'info' : 'err');
  } catch (error) { toast('郵件設定儲存失敗：' + error.message, 'err'); }
  finally { button.disabled = false; }
});
$('settingsBody').addEventListener('input', event => {
  const section = event.target.closest('[data-settings-section]');
  if (section && section.dataset.settingsSection !== 'sizing') SettingsUI.formDirty = true;
});

$('btnRefreshAll').addEventListener('click', () => {
  for (const dev of State.devices) if (dev.enabled) pollOnce(dev);
  toast('已觸發全部刷新');
});

$('drawerClose').addEventListener('click', closeDrawer);
$('drawerBg').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeDrawer();
    closeSettings();
  }
});

// ---------- Boot ----------
// ---------- Brand customization ----------
function renderBrand() {
  const g = State.globalSettings;
  const markEl = document.querySelector('.brand-mark');
  const t1 = document.querySelector('.brand-text .t1');
  const t2 = document.querySelector('.brand-text .t2');
  if (!markEl || !t1 || !t2) return;

  if (g.brandLogo) {
    // 显示图片 logo
    markEl.innerHTML = `<img src="${g.brandLogo}" alt="logo" style="width:100%;height:100%;object-fit:contain">`;
    markEl.style.background = 'transparent';
    markEl.style.padding = '4px';
  } else {
    markEl.innerHTML = escapeHtml(g.brandMark || 'TY');
    markEl.style.background = 'linear-gradient(135deg, var(--solar), #c8870e)';
    markEl.style.padding = '0';
  }
  t1.textContent = g.brandName || 'SOLAR · MULTI';
  t2.textContent = g.brandSub || '';
  document.title = (g.brandName || 'SOLAR') + ' · 監控中心';
}

async function boot() {
  // 1. 先快速从 localStorage 读一份(同步, 几毫秒) 让页面先有内容显示
  loadFromLocalStorage();
  cleanupOldPvAccum();   // 清理 7 天前的 PV 累積記錄
  startPvAccumPolling(); // 啟動 server-side PV 累積拉取
  renderBrand();
  wireHistoryModal();

  // 2. 立刻 ping bridge(并行)
  const bridgePromise = bridgePing();

  // 3. 立刻渲染一次卡片(基于 localStorage 的旧数据)
  renderAllCards();
  renderTopStats();

  // 4. 等 bridge 通了, 从服务端拉权威配置覆盖
  await bridgePromise;
  if (State.bridgeOk) {
    const fromServer = await loadFromServer();
    if (fromServer) {
      // 服务端有配置, 重渲染
      renderBrand();
      renderAllCards();
      renderTopStats();
      console.log('[config] loaded from server');
    } else {
      // 服务端没配置(首次部署?), 把 localStorage 的内容上传过去
      if (State.devices.length > 0 || State.globalSettings.brandName !== 'SOLAR · MULTI') {
        await saveToServer();
        console.log('[config] uploaded local config to server');
      }
    }
  }

  // 5. 开始轮询所有设备
  setInterval(bridgePing, 8000);
  startAllPolling();

  // 6. 周期性从服务端拉最新配置(避免在 A 端改了, B 端永远看不到)
  setInterval(async () => {
    if (!State.bridgeOk) return;
    // 如果用户当前正在打开设置面板, 不要打断他
    if (parseHashRoute().view === 'settings') return;
    const before = JSON.stringify({d: State.devices, s: State.globalSettings});
    await loadFromServer();
    const after = JSON.stringify({d: State.devices, s: State.globalSettings});
    if (before !== after) {
      // 配置变了 — 重新渲染
      renderBrand();
      renderAllCards();
      renderTopStats();
      // 重启轮询(可能新增了设备)
      stopAllPolling();
      startAllPolling();
      console.log('[config] synced from server (config changed)');
    }
  }, 30000);  // 30 秒一次

  // First-time hint
  if (State.devices.length === 0) {
    setTimeout(() => toast('歡迎使用！點擊「⚙ 系統設定」新增第一個設備'), 600);
  }
}
boot();

</script>
